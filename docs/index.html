    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handreiking</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2L2 12l10 10 10-10L12 2z' fill='%23fff176'/><path d='M12 2L2 12h10V2z' fill='%23e57373'/><path d='M22 12L12 22V12h10z' fill='%2364b5f6'/><path d='M2 12l10 10V12H2z' fill='%2381c784'/><path d='M12 6v12M6 12h12' stroke='white' stroke-width='1.5' stroke-linecap='round'/></svg>">
    <style>
        :root {
            /* Light mode - 90s inspired earth tones */
            --bg-primary: #f5f0e8;
            --bg-secondary: #e8e0d0;
            --bg-tertiary: #d8cfc0;
            --text-primary: #2c2416;
            --text-secondary: #4a3f30;
            --text-muted: #6b5d4d;
            --accent: #8b4513;
            --accent-light: #cd853f;
            --border-light: #c0b8a8;
            --border-dark: #887868;
            --shadow-light: #ffffff;
            --shadow-dark: #a09080;
            --link: #5d4037;
            --success: #2e7d32;
            --warning: #f57c00;
            --header-bg: linear-gradient(180deg, #d4c4b0 0%, #c8b8a0 50%, #bca890 100%);
            --menu-bg: #ebe3d8;
            --card-bg: #faf8f5;
            --bevel-light: #ffffff;
            --bevel-dark: #9a8a7a;
        }

        [data-theme="dark"] {
            --bg-primary: #1a1814;
            --bg-secondary: #252118;
            --bg-tertiary: #302a20;
            --text-primary: #e8e0d0;
            --text-secondary: #c8c0b0;
            --text-muted: #9a9080;
            --accent: #cd853f;
            --accent-light: #daa06d;
            --border-light: #3a342a;
            --border-dark: #4a443a;
            --shadow-light: #302a20;
            --shadow-dark: #0a0806;
            --link: #daa06d;
            --success: #66bb6a;
            --warning: #ffb74d;
            --header-bg: linear-gradient(180deg, #302a20 0%, #282218 50%, #201a10 100%);
            --menu-bg: #222018;
            --card-bg: #2a2418;
            --bevel-light: #3a342a;
            --bevel-dark: #0a0806;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Classic 90s beveled frame effect */
        .bevel-raised {
            border: 2px solid;
            border-color: var(--bevel-light) var(--bevel-dark) var(--bevel-dark) var(--bevel-light);
            box-shadow:
                inset 1px 1px 0 var(--shadow-light),
                inset -1px -1px 0 var(--shadow-dark);
        }

        .bevel-inset {
            border: 2px solid;
            border-color: var(--bevel-dark) var(--bevel-light) var(--bevel-light) var(--bevel-dark);
            box-shadow:
                inset 1px 1px 3px var(--shadow-dark),
                inset -1px -1px 0 var(--shadow-light);
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: var(--header-bg);
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
            border-bottom: 3px solid;
            border-color: var(--bevel-dark);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            height: auto;
            min-height: 65px;
        }

        .header-top-row {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-update-banner {
            width: 100%;
            text-align: center;
            font-size: 0.85em;
            color: var(--text-muted);
            padding-top: 8px;
            margin-top: 8px;
            border-top: 1px dashed var(--bevel-dark);
            line-height: 1.4;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .header-update-banner {
                font-size: 0.8em;
                text-align: left;
            }
        }

        header.hidden {
            transform: translateY(-100%);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-toggle {
            display: none;
            background: var(--bg-secondary);
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 20px;
        }

        .logo {
            font-size: 1.4em;
            font-weight: bold;
            color: var(--text-primary);
            text-shadow: 1px 1px 0 var(--shadow-light);
            letter-spacing: 1px;
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #file-selector {
             background: var(--bg-secondary);
             color: var(--text-primary);
             border: none;
             padding: 8px 16px;
             cursor: pointer;
             font-family: inherit;
             font-size: 0.95em;
        }

        #file-selector option[value^="custom:"] {
            font-weight: bold;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: var(--text-primary);
            text-decoration: none;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: var(--accent);
            color: white;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 65px;
            left: 0;
            width: 290px;
            height: calc(100vh - 65px);
            background: var(--menu-bg);
            overflow-y: auto;
            padding: 15px 0 60px 0;
            transition: transform 0.3s ease;
            z-index: 900;
            border-right: 2px solid var(--border-dark);
        }

        .sidebar.hidden {
            transform: translateX(-100%);
        }

        .sidebar-header {
            padding: 10px 20px;
            margin-bottom: 10px;
            background: var(--bg-tertiary);
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .kern-toggle-row {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 6px;
            font-size: 0.8em;
            font-weight: normal;
            text-transform: none;
            letter-spacing: 0;
            color: var(--text-muted);
        }

        .kern-toggle-row input[type="checkbox"] {
            cursor: pointer;
            accent-color: var(--accent);
            width: 14px;
            height: 14px;
            margin: 0;
        }

        .kern-toggle-row label {
            cursor: pointer;
        }

        /* Hide non-kern items when filter is active */
        #nav-items.kern-only .nav-group[data-kern="false"] {
            display: none;
        }

        #nav-items.kern-only .nav-group-header[data-kern-group="false"] {
            display: none;
        }

        #main-content.kern-only section.section[data-kern="false"] {
            display: none;
        }

        .nav-item {
            display: block;
            padding: 10px 20px;
            color: var(--text-secondary);
            text-decoration: none;
            border-left: 4px solid transparent;
            transition: all 0.2s;
            font-size: 0.9em;
            cursor: pointer;
        }

        .nav-item:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-left-color: var(--accent-light);
        }

        .nav-item.active {
            background: var(--bg-secondary);
            color: var(--accent);
            border-left-color: var(--accent);
            font-weight: bold;
        }

        .menu-info-icon {
            font-size: 0.85em;
            opacity: 0.5;
            color: var(--accent);
            cursor: help;
            margin-left: 5px;
        }

        .nav-item:hover .menu-info-icon {
            opacity: 1;
        }

        .nav-number {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            text-align: center;
            line-height: 24px;
            margin-right: 8px;
            font-size: 0.8em;
            font-weight: bold;
        }

        /* Groep kleuren - Liturgisch/Kerkelijk (01, Bijbelteksten) */
        .nav-group-liturgisch .nav-number {
            background: #d4af37;
            color: #f5f0e8;
        }

        /* Groep kleuren - Contextueel (02-07) */
        .nav-group-contextueel .nav-number {
            background: #7a9b6f;
            color: #f5f0e8;
        }

        /* Groep kleuren - Exegese (08a, 08c) */
        .nav-group-exegese .nav-number {
            background: #6b8ba8;
            color: #f5f0e8;
        }

        /* Groep kleuren - Homiletiek (12a-13d) */
        .nav-group-homiletiek .nav-number {
            background: #9b7a9e;
            color: #f5f0e8;
        }

        /* Groep kleuren - Gebeden (14a-14d) */
        .nav-group-gebeden .nav-number {
            background: #c67a7a;
            color: #f5f0e8;
        }

        /* Groep kleuren - Liturgische Elementen (15a-15e) */
        .nav-group-liturgische-elementen .nav-number {
            background: #c88f5f;
            color: #f5f0e8;
        }

        /* Groep kleuren - Preekschetsen (16-19) */
        .nav-group-preekschetsen .nav-number {
            background: #8b6f47;
            color: #f5f0e8;
        }

        /* Groep kleuren - Beeldgeneratie (20-21) */
        .nav-group-beeldgeneratie .nav-number {
            background: #20b2aa; /* LightSeaGreen */
            color: #f5f0e8;
        }

        /* Groep kleuren - Voorbeelden (55) */
        .nav-group-voorbeelden .nav-number {
            background: #4a7c59;
            color: #f5f0e8;
        }

        /* Groep kleuren - Conversationeel */
        .nav-group-conversationeel .nav-number {
            background: #5b7fa6;
            color: #f5f0e8;
        }

        /* Groep headers in menu */
        .nav-group-header {
            padding: 8px 20px 4px 20px;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-tertiary);
            opacity: 0.6;
            font-weight: 600;
            margin-top: 12px;
        }
        .nav-group-header:first-child {
            margin-top: 0;
        }

        .nav-toggle {
            float: right;
            font-size: 0.7em;
            transition: transform 0.2s;
        }

        .nav-item.expanded .nav-toggle {
            transform: rotate(90deg);
        }

        .nav-submenu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            background: var(--menu-bg);
        }

        .nav-submenu.open {
            max-height: 1000px;
        }

        .nav-subitem {
            display: block;
            padding: 6px 20px 6px 52px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8em;
            border-left: 4px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: var(--bg-primary);
            max-width: 100%;
        }

        .nav-subitem:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-left-color: var(--accent-light);
        }



        .subsection-anchor {
            scroll-margin-top: 80px;
        }

        /* Main content */
        main {
            margin-left: 290px;
            margin-top: 65px;
            padding: 30px;
            min-height: calc(100vh - 65px);
            transition: margin 0.3s ease;
        }

        main.full-width {
            margin-left: 0;
        }

        /* Content wrapper for max-width */
        .content-wrapper {
            max-width: none;
        }

        /* Section layout with info panel */
        .section-layout {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 30px;
            align-items: flex-start;
        }

        .section-main-content {
            flex: 1 1 auto;
            min-width: 0;
        }

        .section-info-panel {
            flex: 0 0 450px;
            width: 450px;
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-light);
            position: sticky;
            top: 85px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            opacity: 0.65;
        }

        .section-info-title {
            font-weight: bold;
            font-size: 0.9em;
            color: var(--accent);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .section-info-text {
            font-size: 0.9em;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        @media (max-width: 1100px) {
            .section-info-panel {
                flex: 0 0 260px;
                width: 260px;
            }
        }

        @media (max-width: 900px) {
            .section-layout {
                flex-direction: column;
            }

            .section-info-panel {
                flex: none;
                width: 100%;
                position: static;
                max-height: none;
            }
        }

        /* Welcome screen */
        .welcome {
            text-align: center;
            padding: 80px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .welcome h1 {
            font-size: 2.2em;
            margin-bottom: 20px;
            color: var(--accent);
        }

        .welcome p {
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .welcome-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        /* Content sections */
        .section {
            background: var(--card-bg);
            margin-bottom: 30px;
            padding: 25px;
            scroll-margin-top: 80px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-light);
        }

        .section-number {
            width: 40px;
            height: 40px;
            background: var(--accent);
            color: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1em;
        }

        /* Section number kleuren - Liturgisch/Kerkelijk */
        .section-group-liturgisch .section-number {
            background: #d4af37;
            color: #f5f0e8;
        }

        /* Section number kleuren - Contextueel */
        .section-group-contextueel .section-number {
            background: #7a9b6f;
            color: #f5f0e8;
        }

        /* Section number kleuren - Exegese */
        .section-group-exegese .section-number {
            background: #6b8ba8;
            color: #f5f0e8;
        }

        /* Section number kleuren - Homiletiek */
        .section-group-homiletiek .section-number {
            background: #9b7a9e;
            color: #f5f0e8;
        }

        /* Section number kleuren - Gebeden */
        .section-group-gebeden .section-number {
            background: #c67a7a;
            color: #f5f0e8;
        }

        /* Section number kleuren - Liturgische Elementen */
        .section-group-liturgische-elementen .section-number {
            background: #c88f5f;
            color: #f5f0e8;
        }

        /* Section number kleuren - Preekschetsen */
        .section-group-preekschetsen .section-number {
            background: #8b6f47;
            color: #f5f0e8;
        }

        /* Section number kleuren - Beeldgeneratie */
        .section-group-beeldgeneratie .section-number {
            background: #20b2aa;
            color: #f5f0e8;
        }

        /* Section number kleuren - Voorbeelden */
        .section-group-voorbeelden .section-number {
            background: #4a7c59;
            color: #f5f0e8;
        }

        /* Section number kleuren - Conversationeel */
        .section-group-conversationeel .section-number {
            background: #5b7fa6;
            color: #f5f0e8;
        }

        /* Chat / ronde tafel stijl */
        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 10px 0;
        }

        .chat-meta-block {
            background: var(--bg-secondary);
            border-left: 4px solid #5b7fa6;
            padding: 14px 18px;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .chat-meta-block .data-group-title {
            color: #5b7fa6;
        }

        .chat-participants {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }

        .chat-participant-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            color: white;
        }

        .chat-participant-badge .badge-rol {
            font-weight: normal;
            opacity: 0.85;
            font-size: 0.9em;
        }

        .chat-message {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            max-width: 90%;
        }

        .chat-message.moderator {
            align-self: center;
            max-width: 96%;
            flex-direction: column;
            align-items: stretch;
        }

        .chat-message.right {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .chat-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.95em;
            color: white;
            flex-shrink: 0;
        }

        .chat-bubble {
            background: var(--bg-secondary);
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 100%;
            position: relative;
        }

        .chat-message:not(.right):not(.moderator) .chat-bubble {
            border-top-left-radius: 4px;
        }

        .chat-message.right .chat-bubble {
            border-top-right-radius: 4px;
            background: var(--bg-tertiary);
        }

        .chat-message.moderator .chat-bubble {
            border-radius: 4px;
            border-top: 3px solid #5b7fa6;
            background: var(--bg-secondary);
        }

        .chat-speaker {
            font-weight: bold;
            font-size: 0.82em;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-fase-badge {
            font-size: 0.75em;
            font-weight: normal;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--bg-tertiary);
            color: var(--text-muted);
            text-transform: capitalize;
        }

        .chat-message.moderator .chat-fase-badge {
            background: #5b7fa620;
            color: #5b7fa6;
        }

        .chat-text {
            font-size: 0.92em;
            line-height: 1.65;
            color: var(--text-primary);
        }

        .chat-minority-report {
            margin-top: 30px;
            border-top: 2px dashed var(--border-light);
            padding-top: 20px;
        }

        .chat-minority-block {
            background: var(--bg-secondary);
            border-left: 4px solid var(--accent-light);
            padding: 14px 18px;
            margin-bottom: 12px;
        }

        .chat-minority-block h4 {
            color: var(--accent);
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .chat-minority-block ul {
            list-style: disc;
            padding-left: 18px;
            margin: 0;
        }

        .chat-minority-block ul li {
            font-size: 0.9em;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 5px;
        }

        .section-title {
            font-size: 1.4em;
            color: var(--text-primary);
        }

        .section-meta {
            font-size: 0.85em;
            color: var(--text-muted);
            margin-left: auto;
        }

        /* Data display */
        .data-group {
            margin-bottom: 25px;
        }

        .data-group-title {
            font-size: 1.1em;
            color: var(--accent);
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 1px dashed var(--border-light);
        }

        .data-item {
            display: flex;
            gap: 20px;
            margin-bottom: 8px;
            padding: 12px 15px;
            background: var(--bg-secondary);
            border-radius: 4px;
        }

        .data-item:nth-child(odd) {
            background: var(--bg-tertiary);
        }

        .data-label {
            font-weight: bold;
            color: var(--text-secondary);
            min-width: 220px;
            flex-shrink: 0;
        }

        .data-value {
            color: var(--text-primary);
            flex: 1;
        }

        .data-value a {
            color: var(--link);
        }

        /* Nested objects */
        .nested-object {
            background: var(--bg-primary);
            padding: 15px;
            margin: 10px 0;
            border-left: 3px solid var(--accent-light);
        }

        .nested-title {
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 10px;
        }

        /* Arrays */
        .array-list {
            list-style: none;
            padding: 0;
        }

        .array-item {
            padding: 10px 15px;
            margin: 5px 0;
            background: var(--bg-secondary);
            border-left: 3px solid var(--accent-light);
        }

        .array-item:nth-child(odd) {
            background: var(--bg-tertiary);
        }

        /* Tags */
        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            display: inline-block;
            padding: 4px 12px;
            background: var(--accent);
            color: white;
            border-radius: 15px;
            font-size: 0.85em;
        }

        /* Lied items */
        .lied-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 12px;
            margin: 10px 0;
        }

        .lied-item {
            background: var(--bg-secondary);
            padding: 12px 15px;
            border-left: 4px solid var(--accent);
        }

        .lied-nummer {
            font-weight: bold;
            color: var(--accent);
            font-size: 1em;
        }
        .lied-info-icon {
            color: var(--accent-light);
            text-decoration: none;
            font-size: 0.85em;
            margin-left: 4px;
            opacity: 0.7;
            transition: opacity 0.2s ease;
        }
        .lied-info-icon:hover {
            opacity: 1;
            color: var(--accent);
        }

        .lied-titel {
            font-weight: bold;
            margin: 3px 0;
            font-size: 0.95em;
        }

        .lied-regel {
            color: var(--text-muted);
            font-size: 0.85em;
        }

        .lied-toelichting {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px dashed var(--border-light);
            font-size: 0.85em;
            color: var(--text-secondary);
        }

        /* Scroll to top button */
        .scroll-top {
            position: fixed;
            bottom: 15px;
            right: 40px;
            width: 30px;
            height: 30px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scroll-top.visible {
            opacity: 0.9;
            visibility: visible;
        }

        .scroll-top:hover {
            opacity: 1;
            background: var(--accent-light);
        }

        /* File input hidden */
        #file-input {
            display: none;
        }

        /* Meta info box */
        .meta-box {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            color: white;
            padding: 25px;
            margin-bottom: 30px;
            text-align: center;
        }

        .meta-box h1 {
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .meta-box .gemeente {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .meta-box .datum {
            font-size: 1.4em;
            margin: 10px 0;
        }

        .meta-box .adres {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .meta-box a {
            color: white;
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .menu-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.visible {
                transform: translateX(0);
            }

            main {
                margin-left: 0;
            }

            .data-item {
                flex-direction: column;
            }

            .data-label {
                min-width: auto;
                margin-bottom: 4px;
            }
        }

        @media (max-width: 600px) {
            header {
                padding: 10px 15px;
            }

            .logo {
                font-size: 1.1em;
            }

            .load-btn span {
                display: none;
            }

            main {
                padding: 15px;
            }

            .section {
                padding: 15px;
            }

            .section-header {
                flex-wrap: wrap;
            }

            .section-meta {
                width: 100%;
                margin-left: 0;
                margin-top: 10px;
            }
        }

        /* Loading state */
        .loading {
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid var(--border-light);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 15px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Dark mode toggle */
        .theme-toggle {
            position: relative;
            width: 50px;
            height: 26px;
            background: var(--bg-tertiary);
            border-radius: 13px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .theme-toggle::after {
            content: '☀️';
            position: absolute;
            left: 3px;
            top: 3px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        [data-theme="dark"] .theme-toggle::after {
            content: '🌙';
            left: 27px;
        }

        /* Quote blocks */
        .quote-block {
            background: var(--bg-tertiary);
            border-left: 4px solid var(--accent);
            padding: 15px 20px;
            margin: 15px 0;
            font-style: italic;
        }

        /* Grid layout for cards */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }

        .card-grid-narrow {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin: 10px 0;
        }

        /* Compact nested card */
        .nested-card {
            background: var(--bg-secondary);
            padding: 12px 15px;
            border-left: 3px solid var(--accent-light);
        }

        .nested-card-title {
            font-weight: bold;
            color: var(--accent);
            font-size: 0.95em;
            margin-bottom: 6px;
        }

        .nested-card-content {
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        /* Inline data pairs */
        .data-pairs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px;
            margin-bottom: 20px;
        }

        .data-pair {
            background: var(--bg-secondary);
            padding: 8px 12px;
            border-radius: 4px;
        }

        .data-pair-label {
            font-size: 0.75em;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-pair-value {
            font-weight: 500;
            color: var(--text-primary);
        }

        /* Table-like display for lezingen */
        .lezing-card {
            background: var(--bg-secondary);
            padding: 15px;
            border-left: 4px solid var(--accent);
            display: flex;
            flex-direction: column;
        }

        .lezing-label {
            font-size: 0.8em;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .lezing-ref {
            font-weight: bold;
            font-size: 1.1em;
            color: var(--accent);
        }

        .lezing-thema {
            margin-top: 8px;
            font-style: italic;
            color: var(--text-secondary);
            font-size: 0.95em;
            flex-grow: 1;
        }

        /* Hoorder cards */
        .hoorder-card {
            background: var(--bg-secondary);
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
            border: 2px solid var(--border-light);
        }

        .hoorder-naam {
            font-weight: bold;
            font-size: 1.2em;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .hoorder-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .hoorder-detail {
            padding: 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
        }

        /* Gebed blocks */
        .gebed-block {
            background: var(--bg-secondary);
            padding: 20px;
            margin: 20px 0;
            border-left: 4px solid var(--accent);
            font-style: italic;
            line-height: 1.8;
        }

        .gebed-titel {
            font-weight: bold;
            font-style: normal;
            color: var(--accent);
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        /* Stage directions / instructions */
        .instruction {
            font-style: italic;
            color: var(--text-muted);
        }

        /* Search terms */
        .search-term {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.9em;
            color: var(--link);
            background: var(--bg-tertiary);
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 5px;
        }

        /* Focus en functie cards */
        .focus-card {
            background: var(--bg-secondary);
            padding: 15px;
            margin-bottom: 15px;
            border-left: 5px solid var(--accent);
        }

        .focus-card-header {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 15px;
        }

        .focus-card-number {
            width: 36px;
            height: 36px;
            background: var(--accent);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1em;
            flex-shrink: 0;
        }

        .focus-card-title {
            font-weight: bold;
            font-size: 1.1em;
            color: var(--text-primary);
        }

        .focus-card-type {
            display: inline-block;
            padding: 2px 10px;
            background: var(--accent-light);
            color: white;
            border-radius: 12px;
            font-size: 0.75em;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .focus-sections {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        /* More compact layout for kindermoment */
        .focus-card .focus-sections {
            grid-template-columns: repeat(2, 1fr);
        }

        @media (max-width: 900px) {
            .focus-sections {
                grid-template-columns: 1fr;
            }
        }

        .focus-section {
            background: var(--bg-tertiary);
            padding: 12px;
            border-radius: 4px;
        }

        .focus-section-title {
            font-weight: bold;
            color: var(--accent);
            font-size: 0.85em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .focus-section-content {
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        .focus-toelichting {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed var(--border-light);
            font-style: italic;
            color: var(--text-muted);
            font-size: 0.9em;
        }

        /* Bijbelteksten */
        .bijbel-perikoop {
            background: var(--bg-secondary);
            padding: 20px 25px;
            margin-bottom: 25px;
            border-left: 5px solid var(--accent);
        }

        .bijbel-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-light);
        }

        .bijbel-boek-badge {
            background: var(--accent);
            color: white;
            padding: 6px 14px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9em;
            letter-spacing: 0.5px;
        }

        .bijbel-referentie {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--text-primary);
        }

        .bijbel-verzen {
            line-height: 1.9;
            font-size: 1.05em;
        }

        .bijbel-vers {
            margin-bottom: 8px;
            text-align: justify;
            hyphens: auto;
        }

        .bijbel-vers-nummer {
            display: inline-block;
            font-size: 0.7em;
            font-weight: bold;
            color: var(--accent);
            vertical-align: super;
            margin-right: 3px;
            min-width: 1.5em;
        }

        .bijbel-vers-tekst {
            color: var(--text-primary);
        }

        /* Naardense Bijbel styling (poetic layout) */
        .bijbel-perikoop[data-vertaling="naardense_bijbel"] .bijbel-vers {
            text-align: left;
            hyphens: none;
        }

        .bijbel-perikoop[data-vertaling="naardense_bijbel"] .bijbel-vers-tekst {
            line-height: 1.7;
        }

        /* Grondtekst styling (Hebreeuws/Grieks) */
        .bijbel-perikoop[data-language="Hebreeuws"] .bijbel-verzen {
            direction: rtl;
            text-align: right;
            font-family: 'SBL Hebrew', 'Ezra SIL', 'Times New Roman', serif;
            font-size: 1.2em;
            line-height: 2.2;
        }

        .bijbel-perikoop[data-language="Hebreeuws"] .bijbel-vers {
            text-align: right;
            direction: rtl;
        }

        .bijbel-perikoop[data-language="Hebreeuws"] .bijbel-vers-nummer {
            direction: ltr;
            margin-left: 0;
            margin-right: 3px;
        }

        .bijbel-perikoop[data-language="Grieks"] .bijbel-verzen {
            font-family: 'SBL Greek', 'Gentium Plus', 'Times New Roman', serif;
            font-size: 1.1em;
            line-height: 2.0;
        }

        .bijbel-grondtekst-badge {
            background: #5d4037;
        }

        .bijbel-language-tag {
            font-size: 0.75em;
            color: var(--text-muted);
            margin-left: 10px;
            font-style: italic;
        }

        .bijbel-lezing-type {
            margin-left: auto;
            font-size: 0.85em;
            font-style: italic;
            color: var(--text-muted);
            background: var(--bg-tertiary);
            padding: 4px 10px;
            border-radius: 4px;
        }

        /* Gebeden styling */
        .gebed-card {
            background: var(--bg-secondary);
            padding: 25px;
            margin-bottom: 25px;
            border-left: 5px solid var(--accent);
        }

        .gebed-card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-light);
        }

        .gebed-type-badge {
            background: var(--accent);
            color: white;
            padding: 6px 14px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .gebed-aanspraak {
            font-size: 1.2em;
            font-weight: bold;
            font-style: italic;
            color: var(--text-primary);
        }

        .gebed-tekst {
            font-size: 1.05em;
            line-height: 1.9;
            color: var(--text-primary);
            margin-bottom: 15px;
        }

        .gebed-tekst p {
            margin-bottom: 12px;
        }

        .gebed-echo {
            margin-top: 15px;
            padding: 12px 15px;
            background: var(--bg-tertiary);
            border-left: 3px solid var(--accent-light);
            font-size: 0.9em;
            font-style: italic;
            color: var(--text-muted);
        }

        .gebed-echo-label {
            font-weight: bold;
            font-style: normal;
            color: var(--accent);
            margin-right: 8px;
        }

        .gebed-intenties {
            margin: 15px 0;
        }

        .gebed-intentie {
            padding: 12px 15px;
            margin-bottom: 10px;
            background: var(--bg-tertiary);
            border-left: 3px solid var(--accent-light);
        }

        .gebed-intentie-voor {
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 5px;
        }

        .gebed-intentie-tekst {
            color: var(--text-secondary);
            font-style: italic;
        }

        .gebed-cirkels {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 15px 0;
        }

        .gebed-cirkel {
            padding: 15px;
            background: var(--bg-tertiary);
            border-left: 4px solid var(--accent);
        }

        .gebed-cirkel-header {
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .gebed-cirkel-themas {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .gebed-cirkel-thema {
            background: var(--bg-secondary);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            color: var(--text-secondary);
        }

        .gebed-cirkel-tekst {
            font-style: italic;
            line-height: 1.7;
            color: var(--text-primary);
        }

        .gebed-instructie {
            font-style: italic;
            color: var(--text-muted);
            margin: 15px 0;
            text-align: center;
        }

        .gebed-onze-vader {
            background: var(--bg-tertiary);
            padding: 20px;
            margin-top: 15px;
            font-style: italic;
            line-height: 1.8;
            text-align: center;
            border: 1px solid var(--border-light);
        }

        .gebeden-meta {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid var(--border-light);
        }

        .gebeden-meta-title {
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .gebeden-technieken {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .gebeden-techniek {
            background: var(--bg-secondary);
            padding: 15px;
            border-left: 3px solid var(--accent-light);
        }

        .gebeden-techniek-naam {
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .gebeden-techniek-items {
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        .gebeden-techniek-items li {
            margin-bottom: 4px;
        }

        /* Representatieve Hoorders */
        .hoorder-card {
            background: var(--bg-secondary);
            margin-bottom: 30px;
            border-left: 5px solid var(--accent);
            overflow: hidden;
        }

        .hoorder-header {
            background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, black 30%));
            color: white;
            padding: 20px 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .hoorder-nummer {
            background: rgba(255,255,255,0.2);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
        }

        .hoorder-intro {
            flex: 1;
        }

        .hoorder-naam {
            font-size: 1.4em;
            font-weight: bold;
            margin-bottom: 5px;
            color: inherit;
        }

        .hoorder-meta {
            opacity: 0.9;
            font-size: 0.95em;
        }

        .hoorder-kernschets {
            padding: 20px 25px;
            background: var(--bg-tertiary);
            font-style: italic;
            font-size: 1.05em;
            line-height: 1.7;
            border-bottom: 1px solid var(--border-light);
        }

        .hoorder-content {
            padding: 20px 25px;
        }

        .hoorder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .hoorder-groep {
            background: var(--bg-tertiary);
            padding: 15px;
            border-left: 3px solid var(--accent-light);
        }

        .hoorder-groep-titel {
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 10px;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hoorder-item {
            margin-bottom: 8px;
            font-size: 0.95em;
            line-height: 1.5;
        }

        .hoorder-item-label {
            font-weight: 600;
            color: var(--text-secondary);
        }

        .hoorder-item-value {
            color: var(--text-primary);
        }

        .hoorder-lijst {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .hoorder-lijst li {
            padding: 4px 0;
            padding-left: 15px;
            position: relative;
        }

        .hoorder-lijst li::before {
            content: "•";
            color: var(--accent);
            position: absolute;
            left: 0;
        }

        .hoorder-schrift {
            margin-top: 20px;
            padding: 20px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-light);
        }

        .hoorder-schrift-titel {
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 15px;
            font-size: 1em;
        }

        .hoorder-schrift-item {
            margin-bottom: 12px;
        }

        .hoorder-schrift-label {
            font-weight: 600;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 3px;
        }

        .hoorder-schrift-tekst {
            font-style: italic;
            line-height: 1.6;
        }

        .hoorder-vraag {
            margin-top: 15px;
            padding: 15px;
            background: var(--accent);
            color: white;
            font-style: italic;
            text-align: center;
            font-size: 1.05em;
        }

        /* Motivaction cards */
        .motivaction-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .motivaction-card {
            background: var(--bg-secondary);
            padding: 15px;
            border-left: 4px solid var(--accent);
        }

        .motivaction-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .motivaction-title {
            font-weight: bold;
            color: var(--accent);
            font-size: 1.05em;
        }

        .motivaction-percentage {
            background: var(--accent);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .motivaction-kenmerken {
            font-size: 0.9em;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .motivaction-label {
            font-size: 0.75em;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 10px;
            margin-bottom: 4px;
        }

        .motivaction-tags {

        async function loadFile(fileName) {
             if (!fileName) return;

             mainContent.innerHTML = '<div class="loading">Bestand laden...</div>';

             try {
                 // Ensure section info is loaded first
                 if (!sectionInfo) {
                     await loadSectionInfo();
                 }
                 // Ensure liedboek URLs are loaded
                 if (Object.keys(liedboekUrls).length === 0) {
                     await loadLiedboekUrls();
                 }

                 const response = await fetch(fileName);
                 if (!response.ok) {
                    throw new Error(`Bestand niet gevonden: ${response.statusText}`);
                 }
                 jsonData = await response.json();
                 renderContent();
             } catch (err) {
                 mainContent.innerHTML = `<div class="welcome"><h1>Fout</h1><p>Kon bestand niet laden: ${err.message}</p></div>`;

        function getSearchUrl(query, context) {
            const safeContext = (context || '').toLowerCase();
            const encoded = encodeURIComponent(query);

            // Contexts that should default to Web search
            const webContexts = ['muziek', 'literatuur', 'hedendaags', 'klassiek', 'liturgisch', 'modern', 'nederlands', 'poezie', 'roman', 'boeken', 'liederen', 'songs'];

            // Contexts that should default to Video search
            const videoContexts = ['film_documentaire', 'films', 'video', 'documentaire', 'movie', 'film'];

            if (webContexts.includes(safeContext)) {
                return `https://duckduckgo.com/?origin=funnel_home_google&t=h_&q=${encoded}&ia=web`;
            }

            if (videoContexts.includes(safeContext)) {
                return `https://duckduckgo.com/?origin=funnel_home_google&t=h_&q=${encoded}&ia=videos&iax=videos`;
            }

            return `https://duckduckgo.com/?origin=funnel_home_google&t=h_&q=${encoded}&ia=images&iax=images`;
        }

            // Build nav and content
            let navHtml = '';
            const allSections = Object.keys(jsonData).filter(k => k !== '00_meta' && k !== '02_bijbelteksten');

            // Check if Bijbelteksten exists
            const hasBijbelteksten = allSections.includes('Bijbelteksten');

            // Separate Bijbelteksten from other sections if it exists
            let otherSections = allSections;
            if (hasBijbelteksten) {
                otherSections = allSections.filter(k => k !== 'Bijbelteksten');
            }

            // Determine the highest number from sections that have numeric prefixes
            const numberedSections = otherSections.filter(k => /^(\d+)_/.test(k));
            const highestNum = numberedSections.length > 0
                ? Math.max(...numberedSections.map(k => parseInt(k.match(/^(\d+)_/)[1])))
                : 0;

            // Initialize counter for unnumbered sections
            let unnumberedCounter = highestNum + 1;

            // Sort other sections using a custom function
            function customSectionSort(a, b) {
                const extractParts = (key) => {
                    const match = key.match(/^(\d+)([a-z]?)_?.*$/);
                    if (match) {
                        const num = parseInt(match[1]);
                        const letter = match[2] || '';
                        return { num, letter };
                    }
                    return { num: Infinity, letter: key };
                };

                const partsA = extractParts(a);
                const partsB = extractParts(b);

                if (partsA.num !== partsB.num) {
                    return partsA.num - partsB.num;
                }

                if (partsA.letter !== partsB.letter) {
                    return partsA.letter.localeCompare(partsB.letter);
                }

                return a.localeCompare(b);
            }
            let sortedOtherSections = otherSections.sort(customSectionSort);

            // Custom sort for the 36_gebeden group to ensure 36, 37, 38, 39 order
            const prayerKeys = ['36_gebeden', '37_gebeden_profetisch', '38_gebeden_dialogisch', '39_gebeden_eenvoudig'];
            if (prayerKeys.every(k => sortedOtherSections.includes(k))) {
                // Remove them from their current positions
                sortedOtherSections = sortedOtherSections.filter(k => !prayerKeys.includes(k));
                // Find the index where 36_gebeden would have been or just before 40_kindermoment
                let insertIndex = sortedOtherSections.findIndex(k => k > '36');
                if (insertIndex === -1) insertIndex = sortedOtherSections.length;
                sortedOtherSections.splice(insertIndex, 0, ...prayerKeys);

                    const lezingenOrder = [];

                    if (lezingen) {

                        const orderKeys = ['eerste_lezing', 'psalm', 'epistel', 'evangelie'];

                    const allPerikopen = [];

                    const vertalingLabels = { 'grondtekst': 'Grondtekst', 'nbv21': 'NBV21', 'naardense_bijbel': 'NB' };
                    ['grondtekst', 'nbv21', 'naardense_bijbel'].forEach(vertaling => {
                        if (sectionData[vertaling] && Array.isArray(sectionData[vertaling])) {

                                const normalizedBookCode = bhs2nbv21(bookCode) || bookCode;

                                // Find liturgical order index
                                let orderIndex = lezingenOrder.findIndex(l => {
                                    return l.book === normalizedBookCode && l.chapter === perikoop.chapter;
                                });
                                // Fallback: match by book only (fixes split chapters like Sefanja 2 & 3)
                                if (orderIndex === -1) {
                                     orderIndex = lezingenOrder.findIndex(l => l.book === normalizedBookCode);
                                }
                                if (orderIndex === -1) orderIndex = 999; // Unknown goes to end

                                allPerikopen.push({
                                    vertaling: vertalingLabel,
                                    vertalingKey: vertaling,
                                    book: bookCode,
                                    normalizedBook: normalizedBookCode,
                                    book_nl: perikoop.book_nl,
                                    chapter: perikoop.chapter,
                                    verzen: verzen,
                                    orderIndex: orderIndex,
                                    subKey: `${bookCode}-${perikoop.chapter}-${vertaling}`
                                });
                            });
                        }
                    });

                    // Sort by: 1) liturgical order, 2) translation order, 3) chapter
                    const vertalingOrder = { 'grondtekst': 0, 'nbv21': 1, 'naardense_bijbel': 2 };
                    allPerikopen.sort((a, b) => {
                        if (a.orderIndex !== b.orderIndex) return a.orderIndex - b.orderIndex;
                        if (a.vertalingKey !== b.vertalingKey) {
                             return (vertalingOrder[a.vertalingKey] || 99) - (vertalingOrder[b.vertalingKey] || 99);
                        }
                        return a.chapter - b.chapter;
                    });

                    // Group adjacent pericopes of same translation and book (Navigation Menu)
                    const groupedPerikopen = [];
                    let currentGroup = null;

                    allPerikopen.forEach(perikoop => {
                        if (currentGroup && 
                            currentGroup.vertalingKey === perikoop.vertalingKey && 
                            currentGroup.book === perikoop.book) {
                            // Merge with current group
                            currentGroup.parts.push({chapter: perikoop.chapter, verzen: perikoop.verzen});
                        } else {
                            // Start new group
                            currentGroup = {
                                ...perikoop,
                                parts: [{chapter: perikoop.chapter, verzen: perikoop.verzen}]

                            groupedPerikopen.push(currentGroup);

        // Render Wereldnieuws section with a structured layout

                    html += `<div class="news-date"><strong>Nieuwsoverzicht datum:</strong> ${formatValue(data.nieuwsoverzicht_datum)}</div>`;

                    html += `<div class="news-verification"><strong>Zoek verificatie:</strong><br>${processText(data.zoek_verificatie)}</div>`;
                }
                html += '</div>';

                { key: 'wereldgebeurtenissen', title: 'Wereldgebeurtenissen' },

                { key: 'kerkelijk_nieuws', title: 'Kerkelijk nieuws' }
            ];

            newsSections.forEach(sec => {
                if (data[sec.key] && Array.isArray(data[sec.key]) && data[sec.key].length > 0) {
                    html += `<div id="section-${sectionKey}-${sec.key}" class="subsection-anchor"></div>`;
                    html += `<h3 class="news-category-title">${sec.title}</h3>`;
                    html += `<div class="card-grid">`;
                    data[sec.key].forEach(item => {
                        html += `
                            <div class="nested-card news-card">
                                <div class="news-card-header">
                                    <span class="news-card-category">${escapeHtml(item.categorie || 'Nieuws')}</span>

        // Render Commentaries section
        function renderCommentariesSection(data, sectionKey) {
            let html = '';
            
            const renderPart = (partKey, partTitle) => {
                const part = data[partKey];
                if (!part) return '';
                
                let partHtml = `<div id="section-${sectionKey}-${partKey}" class="subsection-anchor"></div>`;
                partHtml += `<div class="data-group">`;
                partHtml += `<div class="data-group-title">${processText(toSentenceCase(partTitle))}</div>`;
                
                partHtml += `<div class="nested-object" style="background: var(--bg-secondary); border-left-color: var(--accent);">`;
                
                if (part.schriftgedeelte) {
                    partHtml += `<div class="data-item" style="background: var(--bg-tertiary);"><div class="data-label">Schriftgedeelte</div><div class="data-value">${processText(part.schriftgedeelte)}</div></div>`;
                }
                
                if (part.titel) {
                    partHtml += `<h3 style="margin: 15px 0 10px 0; color: var(--accent);">${processText(toSentenceCase(part.titel))}</h3>`;
                }
                
                if (part.korte_samenvatting) {
                    partHtml += `<div class="quote-block" style="background: var(--bg-tertiary); margin-bottom: 20px;">${processText(part.korte_samenvatting)}</div>`;
                }
                
                if (part.tekst) {
                    partHtml += `<div class="preek-tekst" style="margin-bottom: 20px;">${processText(part.tekst)}</div>`;
                }
                
                // Legacy support for per-reading sources (optional)
                if (part.gebruikte_bronnen && Array.isArray(part.gebruikte_bronnen)) {
                    partHtml += `<div style="margin-top:15px; padding-top: 15px; border-top: 1px dashed var(--border-light);"><strong>Gebruikte commentaren:</strong><ul style="margin-top: 10px; margin-left: 20px;">`;
                    part.gebruikte_bronnen.forEach(bron => {
                        partHtml += `<li>${processBibliography(bron)}</li>`;
                    });
                    partHtml += `</ul></div>`;
                }
                
                partHtml += `</div></div>`;
                return partHtml;
            };
            
            html += renderPart('exegese_eerste_lezing', 'Exegese eerste lezing');
            html += renderPart('exegese_evangelielezing', 'Exegese evangelielezing');

            if (data.reflectie) {
                html += `<div id="section-${sectionKey}-reflectie" class="subsection-anchor"></div>`;
                html += `<div class="data-group">`;
                html += `<div class="data-group-title">Reflectie & synthese</div>`;
                
                html += `<div class="nested-object" style="background: var(--bg-secondary); border-left-color: var(--accent);">`;

                if (data.reflectie.theologische_lijnen && Array.isArray(data.reflectie.theologische_lijnen)) {
                    html += `<strong>Theologische lijnen uit de commentaren:</strong><ul style="margin-top: 10px; margin-left: 20px; margin-bottom: 20px;">`;
                    data.reflectie.theologische_lijnen.forEach(lijn => {
                        html += `<li>${processText(lijn)}</li>`;
                    });
                    html += `</ul>`;
                }
                
                if (data.reflectie.homiletische_potentie) {
                    html += `<div style="margin-top:15px; padding-top: 15px; border-top: 1px dashed var(--border-light);"><strong>Homiletische potentie:</strong><div class="preek-tekst" style="margin-top: 10px;">${processText(data.reflectie.homiletische_potentie)}</div></div>`;
                }
                
                html += `</div></div>`;
            }

            // New Bibliography Section
            if (data.bibliografie && Array.isArray(data.bibliografie)) {
                html += `<div id="section-${sectionKey}-bibliografie" class="subsection-anchor"></div>`;
                html += `<div class="data-group">`;
                html += `<div class="data-group-title">Geraadpleegde bronnen</div>`;
                html += `<div class="nested-object" style="background: var(--bg-secondary); border-left-color: var(--accent);">`;
                html += `<ul style="margin-top: 5px; margin-left: 20px;">`;
                data.bibliografie.forEach(bron => {
                    html += `<li style="margin-bottom: 8px;">${processBibliography(bron)}</li>`;
                });
                html += `</ul>`;
                html += `</div></div>`;
            }
            
            return html;
        }

        // Render Wetslezing section
        function renderWetslezingSection(data, sectionKey) {
            let html = '';
            
            const renderPart = (partKey, partTitle) => {
                const part = data[partKey];
                if (!part) return '';
                
                let partHtml = `<div id="section-${sectionKey}-${partKey}" class="subsection-anchor"></div>`;

                partHtml += `<div class="data-group-title">${processText(toSentenceCase(partTitle))}</div>`;
                
                partHtml += `<div class="nested-object" style="background: var(--bg-secondary); border-left-color: var(--accent);">`;
                
                // Render content based on structure
                if (typeof part === 'object') {
                    if (part.tekst) {
                        partHtml += `<div class="preek-tekst" style="font-style: italic; margin-bottom: 15px;">${processText(part.tekst)}</div>`;
                    }
                    if (part.referentie) {
                        partHtml += `<div class="bijbel-referentie" style="font-size: 1.1em; margin-bottom: 8px;">${processText(part.referentie)}</div>`;
                    }
                    if (part.verzen) {
                        partHtml += `<div class="data-value" style="margin-bottom: 8px;"><strong>Verzen:</strong> ${processText(part.verzen)}</div>`;
                    }
                    if (part.kernboodschap) {
                        partHtml += `<div class="quote-block" style="background: var(--bg-tertiary);">${processText(part.kernboodschap)}</div>`;
                    }
                     if (part.functie) {
                        partHtml += `<div class="data-value" style="margin-bottom: 8px;"><span class="tag" style="background: var(--accent-light);">${processText(part.functie)}</span></div>`;
                    }
                    if (part.categorie) {
                        partHtml += `<div class="data-value" style="margin-bottom: 8px;"><span class="tag" style="background: var(--accent-light);">${processText(part.categorie)}</span></div>`;
                    }
                    if (part.motivering) {
                        partHtml += `<div class="toelichting" style="margin-top: 10px; font-size: 0.9em; color: var(--text-secondary); font-style: italic;">${processText(part.motivering)}</div>`;
                    }

                    Object.entries(part).forEach(([k, v]) => {
                        if (!['tekst', 'referentie', 'verzen', 'kernboodschap', 'functie', 'categorie', 'motivering'].includes(k)) {
                             partHtml += renderSingleEntry(k, v, partKey);
                        }

        function renderObject(obj, parentKey = '') {

            let html = '';

            const entries = Object.entries(obj).filter(([k, v]) => !k.startsWith('_') && v !== null && v !== undefined && k !== 'metadata');

            // Check if this object has multiple child objects with simple string values (good for grid)
            const childObjects = entries.filter(([k, v]) => typeof v === 'object' && v !== null && !Array.isArray(v));

            // If we have multiple simple string values, render as compact data pairs
            if (simpleValues.length >= 3 && simpleValues.length <= 8 && childObjects.length === 0) {

                    // Render remaining non-simple values normally
                    const remaining = entries.filter(([k, v]) => typeof v === 'object' || String(v).length >= 100);
                    for (const [key, value] of remaining) {
                        html += renderSingleEntry(key, value, parentKey);

            // If we have multiple child objects, render as grid cards
            if (childObjects.length >= 2 && childObjects.length <= 6) {

                const simpleChildObjects = childObjects.filter(([k, v]) => {

        function renderLiedsuggesties(key, value) {
            let html = `<div class="data-group">`;
            
            // Custom titles and colors for different bundles
            const bundelInfo = {
                'liedboek_2013': { title: 'Liedboek (2013)', color: '#c67a7a' },
                'weerklank': { title: 'Weerklank', color: '#7a9b6f' },
                'weerklank_psalmen': { title: 'Weerklank (Psalmen)', color: '#7a9b6f' },
                'hemelhoog': { title: 'Hemelhoog', color: '#d4af37' },
                'op_toonhoogte': { title: 'Op Toonhoogte (2015)', color: '#c88f5f' },
                'sela': { title: 'Sela + Schrijvers voor Gerechtigheid', color: '#20b2aa' },
                'oke4kids': { title: 'Kinderliederen', color: '#9b7a9e' },
                'nieuwe_psalmberijming': { title: 'De Nieuwe Psalmberijming (DNP)', color: '#3d5a80' }
            };
            
            const info = bundelInfo[key] || { title: formatKey(key), color: 'var(--accent)' };
            const title = info.title;
            const accentColor = info.color;
            
            html += `<div class="data-group-title" style="color: ${accentColor === 'var(--accent)' ? 'var(--accent)' : accentColor}; border-bottom-color: ${accentColor === 'var(--accent)' ? 'var(--border-light)' : accentColor}">${escapeHtml(title)}</div>`;

            // Helper to render grid of songs
            const isLiedboek2013 = (key === 'liedboek_2013');
            const isSela = (key === 'sela');
            const isOke4Kids = (key === 'oke4kids');
            const isNPB = (key === 'nieuwe_psalmberijming');

            const renderGrid = (list) => {
                let gridHtml = `<div class="lied-grid">`;
                list.forEach(lied => {
                    if (typeof lied === 'object') {
                        gridHtml += `<div class="lied-item" style="border-left-color: ${accentColor}">`;
                        // Determine fields based on structure (new vs old)
                        const nummer = lied.nummer;
                        const titel = lied.titel;
                        const regel = lied.eerste_regel; // Old
                        const toelichting = lied.toelichting || lied.match_detail; // New fallback
                        const typeMatch = lied.type_match; // New
                        const suggestie = lied.suggestie_gebruik; // New
                        const bron = lied.bron; // For Sela
                        const credits = lied.credits; // For Oke4Kids

                        if (typeMatch) gridHtml += `<div style="float:right; font-size:0.7em; background:${accentColor}; color:white; padding:2px 6px; border-radius:4px;">${processText(typeMatch)}</div>`;

                        // Special handling for Sela: show bron instead of nummer
                        if (isSela && bron) {
                            gridHtml += `<div class="lied-nummer" style="font-style: italic; color: ${accentColor}">${processText(bron)}</div>`;
                        }
                        // Special handling for Oke4Kids: show credits instead of nummer
                        else if (isOke4Kids && credits) {
                            gridHtml += `<div class="lied-nummer" style="font-size: 0.8em; font-style: italic; color: ${accentColor}">${processText(credits)}</div>`;
                        }
                        // Default: show nummer for other bundels (but not for Sela or Oke4Kids)
                        else if (nummer && !isSela && !isOke4Kids) {
                            let displayNummer = processText(nummer);
                            if (isNPB && !displayNummer.toLowerCase().includes('psalm')) {
                                displayNummer = 'Psalm ' + displayNummer;
                            }
                            
                            let nummerHtml = `<div class="lied-nummer" style="color: ${accentColor}">${displayNummer}`;
                            if (isLiedboek2013 && liedboekUrls[nummer]) {
                                nummerHtml += ` <a href="${liedboekUrls[nummer]}" target="_blank" rel="noopener noreferrer" class="lied-info-icon" title="Achtergrondinformatie op Liedboek Compendium" style="color: ${accentColor}">\u24d8</a>`;
                            }
                            nummerHtml += `</div>`;
                            gridHtml += nummerHtml;
                        }

                        if (titel) gridHtml += `<div class="lied-titel">${processText(titel)}</div>`;

                        if (regel) {
                            const lowRegel = regel.toLowerCase();
                            // Filter out placeholders like 'refrein', 'ref.', '1_EN:', or 'chant ES:'
                            const isPlaceholder = lowRegel.includes('refrein') || lowRegel.includes('ref.') || lowRegel.includes('1_en:') || lowRegel.includes('chant es:');
                            const displayRegel = isPlaceholder ? '...' : `${processText(regel)} ...`;
                            gridHtml += `<div class="lied-regel">\u2018${displayRegel}\u2019</div>`;
                        }
                        
                        if (suggestie) gridHtml += `<div style="font-size:0.85em; color:${accentColor}; margin-top:4px;">Suggestie: ${processText(suggestie)}</div>`;
                        
                        if (toelichting) gridHtml += `<div class="lied-toelichting">${processText(toelichting)}</div>`;
                        gridHtml += `</div>`;
                    }
                });
                gridHtml += `</div>`;
                return gridHtml;
            };

            if (Array.isArray(value)) {
                // NEW STRUCTURE: Direct array of songs
                html += renderGrid(value);
            } else if (typeof value === 'object' && value !== null) {
                // OLD STRUCTURE: nested categories
                for (const [category, liederen] of Object.entries(value)) {
                    if (category.startsWith('_')) continue;
                    if (!Array.isArray(liederen)) continue;

                    html += `<div style="margin-top: 15px; margin-bottom: 8px;"><strong>${escapeHtml(formatKey(category))}</strong></div>`;
                    html += renderGrid(liederen);
                }
            }

            html += `</div>`;
            return html;
        }

        function renderLezingen(value) {
            let html = `<div class="data-group">`;

            let gridCards = [];

                    samenhang = lezing;
                    continue;

                    altLezingen = lezing;
                    continue;
                }

                if (typeof lezing !== 'object') continue;

                let card = `<div class="lezing-card">`;

                if (lezing.referentie) card += `<div class="lezing-ref">${processText(lezing.referentie)}</div>`;

                gridCards.push(card);
            }

            // Render main readings in grid
            if (gridCards.length > 0) {
                html += `<div class="card-grid">${gridCards.join('')}</div>`;
            }

            // Thematische samenhang
            if (samenhang && typeof samenhang === 'string') {
                html += `<div class="quote-block"><strong>Thematische samenhang:</strong><br>${processText(samenhang)}</div>`;
            }

            // Alternative readings
            if (altLezingen && altLezingen.length > 0) {
                html += `<div style="margin-top: 15px;"><strong>Alternatieve lezingen</strong></div>`;

                    let rawTitel = onderdeel.titel || `Deel ${index + 1}`;
                    const inhoud = onderdeel.inhoud || '';
                    const anchorId = sectionKey ? `id="section-${sectionKey}-preek_onderdeel-${index + 1}" ` : '';

                    // Clean redundant numbering from title

                    const cleanTitel = rawTitel.replace(/^([IVXLC]+\.\s*|\d+\.\s*|Deel\s*\d+[:\s]*|Move\s*\d+[:\s]*)/i, '').trim();

                    html += `<div ${anchorId}class="gebed-card" style="margin-bottom: 30px;">`;

                    html += `<span class="gebed-type-badge">${onderdeel.volgorde || index + 1}</span>`;

                    if (onderdeel.toelichting) {
                        html += `<div class="gebed-instructie" style="margin-top: 15px;">${processText(onderdeel.toelichting)}</div>`;

                    // Show stijlnotitie if present (Peterson style)

                    // Show bronnen_notitie if present (Zornberg style)
                    if (onderdeel.bronnen_notitie) {
                        html += `<div class="gebed-instructie" style="margin-top: 15px; border-top: 1px dashed var(--border-light); padding-top: 10px; font-size: 0.85em; opacity: 0.8;"><strong>Bronnen:</strong> ${processText(onderdeel.bronnen_notitie)}</div>`;
                    }

                    html += `</div>`;
                });
            } else {
                // Handle object format (Sölle, Noordmans)
                let counter = 1;
                for (const [key, value] of Object.entries(onderdelen)) {
                    if (!value || typeof value !== 'object') continue;

                    const rawTitel = value.titel || formatKey(key);
                    const inhoud = value.inhoud || '';
                    const anchorId = sectionKey ? `id="section-${sectionKey}-preek_onderdeel-${counter}" ` : '';

                    // Clean redundant numbering from title
                    const cleanTitel = rawTitel.replace(/^([IVXLC]+\.\s*|\d+\.\s*|Deel\s*\d+[:\s]*|Move\s*\d+[:\s]*)/i, '').trim();

                    html += `<div ${anchorId}class="gebed-card" style="margin-bottom: 30px;">`;
