                    html += `</div>`;
                    html += `<div class="gebed-tekst">${processText(inhoud)}</div>`;
                    html += `</div>`;

                    counter++;
                }
            }

            return html;
        }

        function renderHomiletischePlot(plot) {
            let html = `<div class="data-group">`;
            html += `<div class="data-group-title">Homiletische plot</div>`;
            html += `<div class="plot-container">`;

            // Mapping of keys to Dutch abbreviations
            const plotStages = [
                { key: 'he_kwestie_oops', name: 'He' },
                { key: 'oei_verdieping_ugh', name: 'Oei' },
                { key: 'aha_wending_aha', name: 'Aha' },
                { key: 'ja_verkondiging_whee', name: 'Ja' },
                { key: 'zo_doorwerking_yeah', name: 'Zo' }
            ];

            plotStages.forEach(stage => {
                const data = plot[stage.key];
                if (!data) return;

                html += `<div class="plot-card">`;
                html += `<div class="plot-header">`;
                html += `<div class="plot-badge">${stage.name}</div>`;
                html += `<div>`;
                if (data.titel) {
                    // Extract only the part after " - " (e.g., "ZÓ! (YEAH!) - De Doorwerking" → "De Doorwerking")
                    const titelParts = data.titel.split(/\s*-\s*/);
                    const cleanTitel = titelParts.length > 1 ? titelParts.slice(1).join(' - ') : data.titel;
                    html += `<div class="plot-title">${processText(cleanTitel)}</div>`;
                }
                if (data.doel) {
                    html += `<div class="plot-doel">${processText(data.doel)}</div>`;
                }
                html += `</div></div>`;

                html += `<div class="plot-content">`;

                // Render all other fields
                for (const [key, value] of Object.entries(data)) {
                    if (['titel', 'doel'].includes(key)) continue;
                    if (key.startsWith('_')) continue;
                    if (value === null || value === undefined) continue;
                    if (typeof value === 'boolean') continue;

                    if (Array.isArray(value)) {
                        // Handle arrays (like waarom_keten)
                        if (value.length > 0 && typeof value[0] === 'object' && value[0].vraag) {
                            // Waarom-keten format
                            html += `<div><strong>${escapeHtml(formatKey(key))}:</strong><ul style="margin-left: 16px; margin-top: 6px;">`;
                            value.forEach(item => {
                                html += `<li><strong>V:</strong> ${processText(item.vraag || '')}<br><strong>A:</strong> ${processText(item.antwoord || '')}</li>`;
                            });
                            html += `</ul></div>`;
                        } else if (value.every(v => typeof v === 'string')) {
                            html += `<div><strong>${escapeHtml(formatKey(key))}:</strong> ${joinArrayItems(value)}</div>`;
                        } else {
                            html += `<div><strong>${escapeHtml(formatKey(key))}:</strong><ul style="margin-left: 16px; margin-top: 6px;">`;
                            value.forEach(item => {
                                html += `<li>${processText(typeof item === 'string' ? item : JSON.stringify(item))}</li>`;
                            });
                            html += `</ul></div>`;
                        }
                    } else if (typeof value === 'object') {
                        html += `<div><strong>${escapeHtml(formatKey(key))}:</strong></div>`;
                        html += `<div style="margin-left: 16px;">`;
                        for (const [subKey, subVal] of Object.entries(value)) {
                            if (subVal !== null && subVal !== undefined && typeof subVal !== 'object' && typeof subVal !== 'boolean') {
                                html += `<div><strong>${escapeHtml(formatKey(subKey))}:</strong> ${processText(String(subVal))}</div>`;
                            }
                        }
                        html += `</div>`;
                    } else {
                        // Format the value for type_omkering to remove underscores and make it italic
                        if (key === 'type_omkering') {
                            const displayValue = formatKey(String(value));
                            html += `<div><strong>${escapeHtml(formatKey(key))}:</strong> <em>${processText(displayValue)}</em></div>`;
                        } else {
                            html += `<div><strong>${escapeHtml(formatKey(key))}:</strong> ${processText(String(value))}</div>`;
                        }
                    }
                }

                html += `</div></div>`; // end plot-content, plot-card
            });

            html += `</div></div>`; // end plot-container, data-group
            return html;
        }

        // Render Representatieve Hoorders section
        function renderHoordersSection(data, sectionKey) {
            let html = '';
            const personas = data.items || data.personas || [];
            const sk = sectionKey || '14_representatieve_hoorders';

            personas.forEach(persona => {
                const naam = persona.naam ? `${persona.naam.voornaam} ${persona.naam.achternaam}` : 'Onbekend';
                const leeftijd = persona.leeftijd || '';
                const woonwijk = persona.basisgegevens?.woonwijk || '';

                html += `<div id="section-${sk}-personas-${persona.nummer}" class="subsection-anchor"></div>`;
                html += `<div class="hoorder-card">`;

                // Header
                html += `<div class="hoorder-header">`;
                html += `<div class="hoorder-nummer">${persona.nummer || ''}</div>`;
                html += `<div class="hoorder-intro">`;
                html += `<div class="hoorder-naam">${smartQuotes(escapeHtml(naam))}</div>`;
                html += `<div class="hoorder-meta">${leeftijd} jaar${woonwijk ? ` · ${smartQuotes(escapeHtml(woonwijk))}` : ''}</div>`;
                html += `</div></div>`;

                // Kernschets
                if (persona.kernschets) {
                    html += `<div class="hoorder-kernschets">${processText(persona.kernschets)}</div>`;
                }

                html += `<div class="hoorder-content">`;
                html += `<div class="hoorder-grid">`;

                // Persoonlijk (basis + gezondheid)
                html += `<div class="hoorder-groep">`;
                html += `<div class="hoorder-groep-titel">Persoonlijk</div>`;
                if (persona.basisgegevens?.fysieke_verschijning) {
                    html += `<div class="hoorder-item">${processText(persona.basisgegevens.fysieke_verschijning)}</div>`;
                }
                if (persona.gezondheid) {
                    const gz = persona.gezondheid;
                    if (gz.lichamelijk) html += `<div class="hoorder-item"><span class="hoorder-item-label">Lichamelijk:</span> ${processText(gz.lichamelijk)}</div>`;
                    if (gz.mentaal) html += `<div class="hoorder-item"><span class="hoorder-item-label">Mentaal:</span> ${processText(gz.mentaal)}</div>`;
                    if (gz.leefstijl) html += `<div class="hoorder-item"><span class="hoorder-item-label">Leefstijl:</span> ${processText(gz.leefstijl)}</div>`;
                }
                html += `</div>`;

                // Relaties
                if (persona.relaties_sociaal) {
                    const rel = persona.relaties_sociaal;
                    html += `<div class="hoorder-groep">`;
                    html += `<div class="hoorder-groep-titel">Relaties & Sociaal</div>`;
                    const relInfo = [];
                    if (rel.relatiestatus) relInfo.push(rel.relatiestatus);
                    if (rel.woonsituatie) relInfo.push(rel.woonsituatie);
                    if (rel.kinderen) relInfo.push(rel.kinderen);
                    if (relInfo.length > 0) {
                        html += `<div class="hoorder-item">${processText(relInfo.join(' · '))}</div>`;
                    }
                    if (rel.familie_relatie) html += `<div class="hoorder-item">${processText(rel.familie_relatie)}</div>`;
                    if (rel.sociaal_netwerk) html += `<div class="hoorder-item">${processText(rel.sociaal_netwerk)}</div>`;
                    html += `</div>`;
                }

                // Werk & Opleiding
                if (persona.opleiding_werk) {
                    const ow = persona.opleiding_werk;
                    html += `<div class="hoorder-groep">`;
                    html += `<div class="hoorder-groep-titel">Werk & Opleiding</div>`;
                    if (ow.opleiding) html += `<div class="hoorder-item"><span class="hoorder-item-label">Opleiding:</span> ${processText(ow.opleiding)}</div>`;
                    if (ow.huidige_werk) html += `<div class="hoorder-item"><span class="hoorder-item-label">Werk:</span> ${processText(ow.huidige_werk)}</div>`;

                    const tz = persona.traumas_zorgen;
                    html += `<div class="hoorder-groep">`;
                    html += `<div class="hoorder-groep-titel">Zorgen & Worstelingen</div>`;
                    
                    if (tz.verleden) {
                        const verledenText = Array.isArray(tz.verleden) ? tz.verleden.join('; ') : tz.verleden;
                        if (verledenText) {
                            html += `<div class="hoorder-item"><span class="hoorder-item-label">Verleden:</span> ${processText(verledenText)}</div>`;

                    if (tz.onverwerkt) {
                        html += `<div class="hoorder-item"><span class="hoorder-item-label">Onverwerkt:</span> ${processText(tz.onverwerkt)}</div>`;
                    }

                            html += `<div class="hoorder-item"><span class="hoorder-item-label">Vragen:</span><ul class="hoorder-lijst">`;
                            gs.twijfels_vragen.forEach(v => html += `<li>${processText(v)}</li>`);

                    if (gs.spirituele_behoeften) html += `<div class="hoorder-item"><span class="hoorder-item-label">Behoeften:</span> ${processText(gs.spirituele_behoeften)}</div>`;

            return html;

        // Render 61b_fonetische_analyse section
        function renderFonetischeAnalyse(data) {
            let html = '';

            // --- SCORE DASHBOARD ---
            const score = data.fonetische_score;
            if (score) {
                const dims = [
                    { key: 'klanksymboliek',            label: 'Klankkleur',  score: score.klanksymboliek },
                    { key: 'werkgeheugen_architectuur', label: 'Retoriek',    score: score.werkgeheugen_architectuur },
                    { key: 'akoestische_cadans',        label: 'Cadans',      score: score.akoestische_cadans },
                    { key: 'totaal',                    label: 'Totaal',      score: score.totaal, isTotal: true },
                ];

                html += `<div style="display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-bottom: 22px;">`;
                dims.forEach(d => {
                    if (d.score == null) return;
                    const col = d.isTotal ? 'var(--accent)'
                              : d.score >= 8 ? '#4a7c59'
                              : d.score >= 6 ? 'var(--accent-light)'
                              : '#b05a2a';
                    const bg  = d.isTotal ? 'rgba(139,69,19,0.10)'
                              : d.score >= 8 ? 'rgba(74,124,89,0.10)'
                              : d.score >= 6 ? 'rgba(205,133,63,0.10)'
                              : 'rgba(176,90,42,0.10)';
                    // SVG donut: r=15.92 → circumference≈100
                    const dash = `${d.score * 10} 100`;
                    html += `
                        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:80px;max-width:130px;background:${bg};border-radius:8px;padding:14px 8px;">
                            <svg width="72" height="72" viewBox="0 0 36 36" style="transform:rotate(-90deg)">
                                <circle cx="18" cy="18" r="15.92" fill="none" stroke="var(--bg-tertiary)" stroke-width="3.2"/>
                                <circle cx="18" cy="18" r="15.92" fill="none" stroke="${col}" stroke-width="3.2"

                // Diagnose

                                        <span style="background:#4a7c59;color:white;padding:2px 7px;border-radius:3px;font-size:0.74em;font-weight:700;white-space:nowrap;text-transform:uppercase;flex-shrink:0;margin-top:2px;">${escapeHtml(item.type)}</span>

                                    <span>${processText(String(item))}</span>
                                 </div>`;

                }

                html += `</div>`; // end gebed-card
            });

            // --- PRIORITAIRE VERBETERINGEN ---
            const pv = data.prioritaire_verbeteringen;

        // Render 61_feedback_volledige_preek section
        function renderFeedbackVolledigePreekSection(data, sectionKey) {
            let html = '';

            // Map domain keys to display names
            const domeinNamen = {
                'dekker': 'Dekker (8 Stellingen)',
                'aristoteles': 'Aristoteles (Retorische Driehoek)',
                'kolb': 'Kolb (Leercyclus)',
                'schulz_von_thun': 'Schulz von Thun (Communicatie Vierkant)',
                'transactional': 'Transactionele Analyse (Berne)',
                'esthetiek': 'Esthetiek (Schoonheid en Vorm)',
                'metafoor': 'Metafoor (Conceptuele Metafoortheorie)',
                'narratief': 'Narratief (Greimas Actantieel Model)',
                'taalhandeling': 'Taalhandeling (Speech Act Theory)'
            };

            // Try to get domain names from metadata
            if (data._metadata && data._metadata.domeinen) {
                const domeinen = data._metadata.domeinen;
                const keys = Object.keys(data.analyses || {});
                keys.forEach((key, i) => {
                    if (domeinen[i]) domeinNamen[key] = domeinen[i];
                });
            }

            const analyses = data.analyses;
            if (!analyses || typeof analyses !== 'object') {
                return renderObjectWithIds(data, sectionKey);
            }

            // Helper: find overall score in a domain
            function findOverallScore(domainData) {
                // Dekker: average of analyse_per_criterium scores
                if (domainData.analyse_per_criterium) {
                    const criteria = domainData.analyse_per_criterium;
                    const scores = Object.values(criteria)
                        .filter(v => v && typeof v === 'object' && typeof v.score_1_tot_10 === 'number')
                        .map(v => v.score_1_tot_10);
                    if (scores.length) return (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1);
                }
                // Look in known summary keys
                for (const sk of ['totaalbeeld', 'algehele_beoordeling', 'totaalbeeld_esthetiek', 'conclusie_en_aanbeveling']) {
                    if (domainData[sk] && typeof domainData[sk] === 'object') {
                        for (const [k, v] of Object.entries(domainData[sk])) {
                            if (k.toLowerCase().includes('score') && typeof v === 'number') return v;
                        }
                    }
                }
                return null;
            }

            // Helper: find summary text in a domain
            function findSummary(domainData) {
                for (const sk of ['totaalbeeld', 'algehele_beoordeling', 'totaalbeeld_esthetiek', 'conclusie_en_aanbeveling', 'diagnostische_evaluatie']) {
                    if (domainData[sk] && typeof domainData[sk] === 'object') {
                        const summary = domainData[sk].samenvatting || domainData[sk].conclusie || domainData[sk].eindoordeel_volgens_dekker || '';
                        if (summary) return summary;
                    }
                }
                return '';
            }

            // Helper: find verbeterpunten
            function findVerbeterpunten(domainData) {
                const punten = [];
                for (const sk of ['totaalbeeld', 'algehele_beoordeling', 'totaalbeeld_esthetiek', 'conclusie_en_aanbeveling', 'aanbevelingen']) {
                    if (domainData[sk] && typeof domainData[sk] === 'object') {
                        const vp = domainData[sk].verbeterpunten_top_3 || domainData[sk].zwakke_punten || domainData[sk].verbeterpunten || [];
                        if (Array.isArray(vp) && vp.length) return vp;
                        // Check nested
                        for (const v of Object.values(domainData[sk])) {
                            if (Array.isArray(v) && v.length && typeof v[0] === 'string' && v[0].length > 20) {
                                return v;
                            }
                        }
                    }
                }
                // Check aanbevelingen at top level
                if (domainData.aanbevelingen && typeof domainData.aanbevelingen === 'object') {
                    for (const v of Object.values(domainData.aanbevelingen)) {
                        if (typeof v === 'string' && v.length > 20) punten.push(v);
                        if (Array.isArray(v)) punten.push(...v.filter(x => typeof x === 'string'));
                    }
                    if (punten.length) return punten.slice(0, 5);
                }
                return [];
            }

            // Helper: find sterke punten
            function findSterkePunten(domainData) {
                for (const sk of ['totaalbeeld', 'algehele_beoordeling', 'totaalbeeld_esthetiek', 'conclusie_en_aanbeveling']) {
                    if (domainData[sk] && typeof domainData[sk] === 'object') {
                        const sp = domainData[sk].sterke_punten_top_3 || domainData[sk].sterke_punten || [];
                        if (Array.isArray(sp) && sp.length) return sp;
                    }
                }
                return [];
            }

            // Render each domain as a collapsible card
            for (const [domainKey, domainData] of Object.entries(analyses)) {
                if (!domainData || typeof domainData !== 'object') continue;

                const displayName = domeinNamen[domainKey] || domainKey.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                const score = findOverallScore(domainData);
                const summary = findSummary(domainData);
                const sterkePunten = findSterkePunten(domainData);
                const verbeterpunten = findVerbeterpunten(domainData);

                const scoreHtml = score !== null
                    ? `<span style="background: var(--accent); color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.85em; margin-left: 8px;">${score}</span>`
                    : '';

                const detailId = `feedback-detail-${sectionKey}-${domainKey}`;

                html += `<div class="gebed-card" style="margin-bottom: 16px;">`;

                // Header (clickable)
                html += `<div style="cursor: pointer; display: flex; align-items: center; justify-content: space-between;" onclick="const el = document.getElementById('${detailId}'); el.style.display = el.style.display === 'none' ? 'block' : 'none'; this.querySelector('.toggle-arrow').textContent = el.style.display === 'none' ? '▸' : '▾';">`;
                html += `<div style="display: flex; align-items: center;">`;
                html += `<span class="toggle-arrow" style="margin-right: 8px; color: var(--accent); font-size: 0.9em;">▸</span>`;
                html += `<span style="font-weight: 600; color: var(--accent);">${escapeHtml(displayName)}</span>`;
                html += scoreHtml;
                html += `</div>`;
                html += `</div>`;

                // Summary (always visible)
                if (summary) {
                    html += `<div style="margin-top: 10px; line-height: 1.65; color: var(--text-primary);">${processText(summary)}</div>`;
                }

                // Sterke punten (always visible)
                if (sterkePunten.length) {
                    html += `<div style="margin-top: 10px;">`;
                    html += `<div style="font-weight: 600; font-size: 0.9em; color: var(--text-secondary); margin-bottom: 4px;">Sterke punten</div>`;
                    sterkePunten.forEach(p => {
                        html += `<div class="list-item" style="margin: 0 0 0 15px; position: relative; padding-left: 15px;"><span style="position: absolute; left: 0; color: var(--accent);">+</span>${processText(p)}</div>`;
                    });
                    html += `</div>`;
                }

                // Verbeterpunten (always visible)
                if (verbeterpunten.length) {
                    html += `<div style="margin-top: 10px;">`;
                    html += `<div style="font-weight: 600; font-size: 0.9em; color: var(--text-secondary); margin-bottom: 4px;">Verbeterpunten</div>`;
                    verbeterpunten.forEach(p => {
                        html += `<div class="list-item" style="margin: 0 0 0 15px; position: relative; padding-left: 15px;"><span style="position: absolute; left: 0; color: var(--accent);">–</span>${processText(p)}</div>`;
                    });
                    html += `</div>`;
                }

                // Collapsible detail (hidden by default)
                html += `<div id="${detailId}" style="display: none; margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--border-light);">`;
                // Render full domain data, skipping metadata and _usage
                const filteredData = {};
                for (const [k, v] of Object.entries(domainData)) {
                    if (k === 'metadata' || k === '_usage') continue;
                    filteredData[k] = v;
                }
                html += renderObjectWithIds(filteredData, sectionKey + '-' + domainKey);
                html += `</div>`;

                html += `</div>`; // end gebed-card
            }

            return html;
        }

        // Render Postille preekschets section with stacked layout
        function renderPostilleSection(data) {
            const preek = data.preekschets || data;
            let html = '';

            // Metadata block
            if (preek.metadata) {
                const m = preek.metadata;
                html += `<div class="data-group">`;
                html += `<div class="data-group-title">Metadata</div>`;
                html += `<div class="nested-object">`;
                if (m.perikoop) html += `<div class="data-item"><div class="data-label">Perikoop</div><div class="data-value">${escapeHtml(m.perikoop)}</div></div>`;
                if (m.liturgische_dag) html += `<div class="data-item"><div class="data-label">Liturgische dag</div><div class="data-value">${escapeHtml(m.liturgische_dag)}</div></div>`;
                if (m.kerntekst) html += `<div class="data-item"><div class="data-label">Kerntekst</div><div class="data-value">${escapeHtml(m.kerntekst)}</div></div>`;
                if (m.oneliner) html += `<div class="data-item"><div class="data-label">Oneliner</div><div class="data-value"><em>${processText(m.oneliner)}</em></div></div>`;
                html += `</div></div>`;
            }

            // Lange tekstvelden
            const longFields = [
                { key: 'eigene_van_de_zondag', label: 'Eigene van de zondag' },
                { key: 'uitleg',               label: 'Uitleg' },
                { key: 'aanwijzingen_prediking', label: 'Aanwijzingen voor de prediking' },
            ];
            for (const { key, label } of longFields) {
                if (preek[key]) {

            if (data.profetische_elementen) {

        // Render Midjourney Prompts section

                    html += `<div class="data-item">

                });

            // Gebruiksinstructies

                html += `<h3 class="news-category-title">Technische notities</h3>`;

        // Render Preekschets section
        function renderPreekschetsSection(data, sectionKey) {
            let html = '';

            html += `<div class="gebed-card" style="margin-bottom: 30px;">`;

            // Brueggemann (Poet) Method Selection Display
            if (data.gehanteerde_methode_selectie && Array.isArray(data.gehanteerde_methode_selectie)) {

                html += `<div class="data-group-title">Gekozen homiletische methode</div>`;
                html += `<ul style="list-style: none; padding: 0; margin-top: 10px;">`;
                
                // Mapping van methode nummer naar markdown bestand in prompts/finally_comes_the_poet__prompts/
                const methodFiles = {
                    1: "Methode_1_Schuld_en_Genezing.md",
                    2: "Methode_2_Klacht_naar_Lofprijzing.md",
                    3: "Methode_3_Rusteloosheid_en_Hebzucht.md",
                    4: "Methode_4_Verzet_en_Overgave.md"
                };

                data.gehanteerde_methode_selectie.forEach(m => {
                    const isSelected = m.geselecteerd === true || m.geselecteerd === "true";
                    const fontWeight = isSelected ? 'bold' : 'normal';
                    const color = isSelected ? 'var(--accent)' : 'var(--text-muted)';
                    const icon = isSelected ? '● ' : '○ ';
                    const fileName = methodFiles[m.methode_nummer];
                    const infoLink = fileName ? ` <a href="https://github.com/wmotte/voorbereiding/blob/main/prompts/finally_comes_the_poet__prompts/${fileName}" target="_blank" title="Bekijk methodiek op GitHub" style="color: inherit; text-decoration: none; font-weight: normal; margin-left: 5px;">ⓘ</a>` : '';
                    
                    html += `<li style="padding: 4px 0; color: ${color}; font-weight: ${fontWeight}; list-style: none;">`;
                    html += `${icon} Methode ${m.methode_nummer}: ${processText(m.methode_naam)}${infoLink}`;
                    html += `</li>`;
                });
                
                html += `</ul>`;
                html += `</div>`;
            } else if (data.methode && data.methode_nummer) {
                // Fallback for when full selection list is missing but specific method is chosen
                const methodFiles = {
                    1: "Methode_1_Schuld_en_Genezing.md",
                    2: "Methode_2_Klacht_naar_Lofprijzing.md",
                    3: "Methode_3_Rusteloosheid_en_Hebzucht.md",
                    4: "Methode_4_Verzet_en_Overgave.md"
                };
                const fileName = methodFiles[data.methode_nummer];
                const infoLink = fileName ? ` <a href="https://github.com/wmotte/voorbereiding/blob/main/prompts/finally_comes_the_poet__prompts/${fileName}" target="_blank" title="Bekijk methodiek op GitHub" style="color: inherit; text-decoration: none; font-weight: normal; margin-left: 5px;">ⓘ</a>` : '';

                html += `<div class="data-group" style="margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px dashed var(--border-light);">`;
                html += `<div class="data-group-title">Gekozen homiletische methode</div>`;
                html += `<div style="margin-top: 10px; font-weight: bold; color: var(--accent);">`;
                html += `● Methode ${data.methode_nummer}: ${processText(data.methode)}${infoLink}`;
                html += `</div></div>`;
            }

            // Title
            if (data.titel) {
                html += `<div id="section-${sectionKey}-titel" class="subsection-anchor"></div>`;
                html += `<div class="data-item">`;
                html += `<div class="data-label">Titel</div>`;

                html += `</div>`;

            if (data.centrale_metafoor) {
                html += `<div id="section-${sectionKey}-centrale_metafoor" class="subsection-anchor"></div>`;

        // Render all Bijbelteksten in liturgical order
        function renderBijbeltekstenSection(data) {
            // Get lezingen info to determine reading type and order
            const lezingen = getKerkelijkJaarData()?.lezingen || {};
            const orderKeys = ['eerste_lezing', 'psalm', 'epistel', 'evangelie'];
            const lezingTypes = {
                'eerste_lezing': 'Eerste lezing',
                'psalm': 'Psalm',
                'epistel': 'Epistel',
                'evangelie': 'Evangelie'
            };

            // Build liturgical order array
            const lezingenOrder = [];
            orderKeys.forEach(lezingKey => {
                if (lezingen[lezingKey]) {
                    const lez = lezingen[lezingKey];
                    const boekCode = getBoekCode(lez.boek || lez.referentie);
                    const hoofdstuk = lez.hoofdstuk || lez.nummer;
                    if (boekCode && hoofdstuk) {
                        lezingenOrder.push({ book: boekCode, chapter: hoofdstuk, type: lezingTypes[lezingKey] });
                    }
                }
            });

            // Add alternative readings
            if (lezingen.alternatieve_lezingen && Array.isArray(lezingen.alternatieve_lezingen)) {
                lezingen.alternatieve_lezingen.forEach(alt => {
                    const boekCode = getBoekCode(alt.referentie);
                    const match = alt.referentie?.match(/(\d+)[,:.]/);
                    const hoofdstuk = match ? parseInt(match[1]) : null;
                    if (boekCode && hoofdstuk) {
                        lezingenOrder.push({ book: boekCode, chapter: hoofdstuk, type: 'Alternatieve lezing' });
                    }
                });
            }

            // Collect all perikopen from all translations
            const allPerikopen = [];
            const vertalingen = ['grondtekst', 'nbv21', 'naardense_bijbel'];

            vertalingen.forEach(vertalingKey => {
                if (data[vertalingKey] && Array.isArray(data[vertalingKey])) {
                    data[vertalingKey].forEach(perikoop => {
                        // Grondtekst uses book_original, NBV21/NB use book
                        const bookCode = perikoop.book || perikoop.book_original;

                        // For grondtekst, convert book_original to NBV21 code for matching
                        const normalizedBookCode = bhs2nbv21(bookCode) || bookCode;

                        // Find liturgical order index
                        let orderIndex = lezingenOrder.findIndex(l => {
                            return l.book === normalizedBookCode && l.chapter === perikoop.chapter;
                        });
                        // Fallback: match by book only (fixes split chapters like Sefanja 2 & 3)
                        if (orderIndex === -1) {
                             orderIndex = lezingenOrder.findIndex(l => l.book === normalizedBookCode);
                        }
                        if (orderIndex === -1) orderIndex = 999;

                        // Get reading type
                        const lezingInfo = lezingenOrder.find(l => {
                            return l.book === normalizedBookCode && l.chapter === perikoop.chapter;
                        });

                        allPerikopen.push({
                            ...perikoop,
                            book: bookCode,
                            normalizedBook: normalizedBookCode,
                            vertalingKey: vertalingKey,
                            orderIndex: orderIndex,
                            lezingType: lezingInfo?.type || ''
                        });
                    });
                }
            });

            // Sort by: 1) liturgical order, 2) translation order, 3) chapter
            const vertalingOrder = { 'grondtekst': 0, 'nbv21': 1, 'naardense_bijbel': 2 };
            allPerikopen.sort((a, b) => {
                if (a.orderIndex !== b.orderIndex) return a.orderIndex - b.orderIndex;
                if (a.vertalingKey !== b.vertalingKey) {
                     return (vertalingOrder[a.vertalingKey] || 99) - (vertalingOrder[b.vertalingKey] || 99);
                }
                return a.chapter - b.chapter;
            });

            // Group adjacent pericopes of same translation and book
            const groupedPerikopen = [];
            let currentGroup = null;

            allPerikopen.forEach(perikoop => {
                // Determine verse range for reference building
                const eersteVers = perikoop.verses[0]?.verse || 1;
                const laatsteVers = perikoop.verses[perikoop.verses.length - 1]?.verse || eersteVers;
                const verzenRef = eersteVers === laatsteVers ? eersteVers : `${eersteVers}-${laatsteVers}`;

                if (currentGroup && 
                    currentGroup.vertalingKey === perikoop.vertalingKey && 
                    currentGroup.book === perikoop.book) {
                    // Merge with current group
                    currentGroup.verses.push(...perikoop.verses);
                    currentGroup.parts.push({chapter: perikoop.chapter, verzen: verzenRef});
                } else {
                    // Start new group
                    currentGroup = {
                        ...perikoop,
                        parts: [{chapter: perikoop.chapter, verzen: verzenRef}],
                        verses: [...perikoop.verses] // Copy verses
                    };
                    groupedPerikopen.push(currentGroup);
                }
            });

            // Render grouped perikopen
            const vertalingNamen = {
                'naardense_bijbel': 'NB',
                'nbv21': 'NBV21',
                'grondtekst': 'Grondtekst'
            };

            let html = '';

            groupedPerikopen.forEach(perikoop => {
                const vertalingTitel = vertalingNamen[perikoop.vertalingKey] || perikoop.vertalingKey;
                const boekNaam = perikoop.book_nl || getBijbelboekNaam(perikoop.book);
                
                // Build combined reference string
                const refString = perikoop.parts.map(part => `${part.chapter}:${part.verzen}`).join('; ');

                // Anchor ID matches the submenu navigation (using first chunk's key)

        function formatKey(key) {

            } else if (key === 'werkenden_18_65') {

            } else if (key === 'ouderen_65_plus') {
                result = "Ouderen 65+";
            } else if (key === 'kernwords') {
                result = "Kernwoorden";
            } else if (key === 'prompt_nl') {
                result = "Prompt (Nederlands)";
            } else if (key === 'prompt_en') {
                result = "Prompt (Engels)";
            } else if (key === 'voice_en_delivery') {
                result = "Stem en voordracht";
            } else if (key === 'non_verbale_communicatie') {
                result = "Non-verbale communicatie";
            } else if (key === 'primaire_appeal') {

            } else if (key === 'call_to_action') {
                result = "Oproep tot actie";
            } else if (key === 'aristotelische_appeals') {
                result = "Aristotelische overtuigingsmiddelen";
            } else {
                result = key
                    .replace(/^\d+[a-z]?_/, '')  // Remove number prefix like "03_" or "13a_"
                    .replace(/_/g, ' ')
                    .replace(/([a-z])([A-Z])/g, '$1 $2')
                    .replace(/^./, str => str.toUpperCase());

                // Apply capitalization rules for exceptions (government institutions, etc.)
                const exceptions = ['Tweede', 'Kamer', 'Provinciale', 'Staten', 'Europees', 'Parlement', 'God', 'Gods', 'Jezus', 'Christus', 'Heere', 'HEERE', 'Heer'];
                const words = result.split(' ');
                result = words.map((word, index) => {
                    if (index === 0) return word; // Keep first word as is
                    const wordCapitalized = word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
                    if (exceptions.includes(wordCapitalized)) {
                        return wordCapitalized;
                    }
                    return word.toLowerCase();
                }).join(' ');
            }

            // Preserve abbreviations with multiple capitals
            const abbreviations = {
                'Nbv21': 'NBV21',
                'nbv21': 'NBV21',
                'Nbv': 'NBV',
                'nbv': 'NBV',
                ' Ot ': ' OT ',
                ' Nt ': ' NT ',
                ' ot ': ' OT ',
                ' nt ': ' NT ',
                'Pkn': 'PKN',
                'pkn': 'PKN'
            };

            for (const [wrong, correct] of Object.entries(abbreviations)) {
                result = result.replace(new RegExp(wrong, 'gi'), correct);
            }

            // Dutch plural corrections (words ending in vowel + s need apostrophe)
            const pluralCorrections = {
                'themas': 'thema\u2019s',
                'Themas': 'Thema\u2019s',
                'schemas': 'schema\u2019s',
                'Schemas': 'Schema\u2019s',
                'dilemmas': 'dilemma\u2019s',
                'Dilemmas': 'Dilemma\u2019s',
                'traumas': 'trauma\u2019s',
                'Traumas': 'Trauma\u2019s',
                'panoramas': 'panorama\u2019s',
                'Panoramas': 'Panorama\u2019s'
            };

            for (const [wrong, correct] of Object.entries(pluralCorrections)) {
                result = result.replace(new RegExp(`\\b${wrong}\\b`, 'g'), correct);
            }

            return result;
        }

        function formatValue(value) {
            if (value === null || value === undefined) return '<em>-</em>';
            if (typeof value === 'boolean') return value ? 'Ja' : 'Nee';
            // Replace string "null" values
            if (value === 'null' || value === 'NULL') {
                return '<em>geen gegevens beschikbaar</em>';
            }
            if (typeof value === 'string') {
                // Check if it's a URL
                if (value.match(/^https?:\/\//)) {
                    return `<a href="${escapeHtml(value)}" target="_blank">${escapeHtml(value)}</a>`;
                }
                // Replace underscores with spaces for readable output
                return processText(value.replace(/_/g, ' '));
            }
            return processText(String(value));
        }

        function escapeHtml(text) {
            if (typeof text !== 'string') return text;
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Convert straight quotes to curly quotes
        function smartQuotes(text) {
            if (typeof text !== 'string') return text;
            return text
                // First convert all double quotes to single quotes
                .replace(/"/g, "'")

                // Single quotes and apostrophes
                // Dutch contractions first: 's, 't, 'n, 'm (these are apostrophes, not opening quotes)
                .replace(/(^|[\s(\[{<])'([stnmSTNM])\b/g, '$1\u2019$2')
                // Apostrophe within words (don't, it's, etc.)
                .replace(/(\w)'(\w)/g, '$1\u2019$2')
                // Opening single quote after space/start/colon (but not Dutch contractions)
                .replace(/(^|[\s(\[{<:])'(\S)/g, '$1\u2018$2')
                // Closing single quote before space/end/punctuation
                .replace(/(\S)'([\s)\]}>,.:;!?]|$)/g, '$1\u2019$2')
                // Remaining single quotes -> apostrophe
                .replace(/'/g, '\u2019');
        }

        // Escape HTML and apply smart quotes (for nav labels and similar)
        function escapeAndSmartQuotes(text) {
            if (typeof text !== 'string') return text;
            return smartQuotes(escapeHtml(text));
        }

        // Helper to convert to Sentence case
        function toSentenceCase(str) {
            if (typeof str !== 'string' || str.length === 0) {
                return str;
            }
            // A list of words that should always be lowercase unless they are the first word.
            const articles = ['a', 'an', 'the'];
            const conjunctions = ['and', 'but', 'or', 'for', 'nor'];
            const prepositions = [
                'at', 'by', 'for', 'from', 'in', 'into', 'of', 'on', 'to', 'with', 
                'up', 'down', 'over', 'under', 'above', 'below'
            ];
            const lowerCaseWords = new Set([...articles, ...conjunctions, ...prepositions]);

            let words = str.toLowerCase().split(' ');
            // Always capitalize the first word
            words[0] = words[0].charAt(0).toUpperCase() + words[0].substring(1);

            for (let i = 1; i < words.length; i++) {
                // If a word contains a colon, capitalize the next word
                if (words[i-1].endsWith(':')) {
                     words[i] = words[i].charAt(0).toUpperCase() + words[i].substring(1);
                }
                // Capitalize words not in the lowercase list
                else if (!lowerCaseWords.has(words[i])) {
                    words[i] = words[i].charAt(0).toUpperCase() + words[i].substring(1);
                }
            }
            return words.join(' ');
        }
        
        // Helper to convert to Title Case, respecting certain acronyms
        function toTitleCase(str) {
             if (typeof str !== 'string' || str.length === 0) {
                return str;
            }
            const acronyms = ['P&R'];
            return str.split(' ').map(word => {
                if (acronyms.includes(word.toUpperCase())) return word.toUpperCase();
                if (word.toLowerCase() === 'and') return 'and';
                return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
            }).join(' ');
        }
        
        // Process bibliography text: keep original capitalization but apply escaping and quotes
        // Format: Author in bold, title in italic
        function processBibliography(text) {
            if (typeof text !== 'string') return text;
            
            // Remove Markdown italic/bold markers as we apply our own formatting
            let result = text.replace(/\*/g, '');

            // First convert literal \n to actual newlines
            result = result.replace(/\\n/g, '\n');

            // Escape HTML special characters
            result = escapeHtml(result);

            // 1. Find the Year block: (YYYY) or (n.d.) or (c. YYYY) followed by a dot.
            // We search for this pattern to split Author from the rest.
            const yearRegex = /\s*\((?:\d{4}[a-z]?|n\.d\.|c\.\s*\d{4})\)\./;
            const match = result.match(yearRegex);

            if (match) {
                const index = match.index;
                const yearStr = match[0]; // e.g. " (2020)." (includes leading space and trailing dot)
                
                const author = result.substring(0, index).trim();
                let rest = result.substring(index + yearStr.length).trim();
                
                // Now parse "Rest" into Title and Publisher.
                // Standard format: "Title. City: Publisher." OR "Title. Publisher."
                // Heuristic: Look for the LAST colon.
                let title = rest;
                let publisher = "";
                let hasPublisher = false;

                const lastColonIndex = rest.lastIndexOf(':');
                if (lastColonIndex !== -1) {
                    // We have a colon. Assume "City: Publisher" at the end.
                    // But we need to make sure the colon isn't part of the Title (e.g. "Title: Subtitle").
                    // Usually, if there is a publisher, there is a period separating Title and City.
                    // "Title: Subtitle. City: Publisher."
                    
                    // Look at the text BEFORE the last colon.
                    const beforeLastColon = rest.substring(0, lastColonIndex);
                    // Find the last dot in that part.
                    const lastDotInBefore = beforeLastColon.lastIndexOf('.');
                    
                    if (lastDotInBefore !== -1) {
                        // "Title... . City" : "Publisher"
                        // Everything before that last dot is the Title.
                        title = rest.substring(0, lastDotInBefore).trim();
                        // Everything after is the Publisher block (City: Publisher).
                        publisher = rest.substring(lastDotInBefore + 1).trim();
                        hasPublisher = true;
                    } else {
                        // No dot before colon? Could be "Title: Subtitle. Publisher"
                        // Look for a dot AFTER the colon to separate title from publisher
                        const afterColon = rest.substring(lastColonIndex + 1);
                        const dotAfterColon = afterColon.indexOf('.');

                        if (dotAfterColon !== -1) {
                            // Found a dot after the colon: "Title: Subtitle. Publisher"
                            const absoluteDotPos = lastColonIndex + 1 + dotAfterColon;
                            title = rest.substring(0, absoluteDotPos).trim();
                            publisher = rest.substring(absoluteDotPos + 1).trim();
                            hasPublisher = true;
                        }
                        // Otherwise treat whole thing as title (no publisher detected)
                    }
                } else {
                    // No colon.
                    // "Title. Publisher."
                    // Find last dot (excluding the very last one if present).
                    let checkStr = rest;
                    if (checkStr.endsWith('.')) checkStr = checkStr.slice(0, -1);
                    
                    const lastDot = checkStr.lastIndexOf('.');
                    if (lastDot !== -1) {
                        title = rest.substring(0, lastDot).trim();
                        publisher = rest.substring(lastDot + 1).trim();
                        hasPublisher = true;
                    }
                }

                // If we found a publisher, format it.
                if (hasPublisher) {
                    // Remove trailing dot from title if logic left it (it shouldn't if we split on dot)
                     if (title.endsWith('.')) title = title.slice(0, -1).trim();

                     // Ensure publisher has trailing dot
                     if (!publisher.endsWith('.')) publisher += '.';

                     return `<strong>${author}</strong> <span style="color: #666;">${yearStr.trim()}</span> <em>${smartQuotes(title)}.</em> <span style="color: #666;">${smartQuotes(publisher)}</span>`;
                }

                // Fallback: just Author and Rest
                return `<strong>${author}</strong> <span style="color: #666;">${yearStr.trim()}</span> ${smartQuotes(rest)}`;
            }

            // Fallback for non-standard entries (no year pattern found)
            // Try to split on first dot?
            const firstDot = result.indexOf('.');
            if (firstDot !== -1) {
                 const author = result.substring(0, firstDot).trim();
                 const rest = result.substring(firstDot + 1).trim();
                 // Return Author bolded, but don't try to guess Title/Publisher styling
                 return `<strong>${author}</strong>. ${rest}`;
            }

            // Convert quotes to curly quotes
            result = smartQuotes(result);
            // Convert newlines to <br> tags
            result = result.replace(/\n/g, '<br>');
            return result;
        }

        // Helper: join array items with comma, making items after first lowercase
        function joinArrayItems(array) {
            const exceptions = ['God', 'Gods', 'Jezus', 'Christus', 'Heere', 'HEERE', 'Heer', 'Vader', 'Zoon', 'Geest', 'Heilige', 'Tweede', 'Kamer', 'Provinciale', 'Staten', 'Europees', 'Parlement'];

            return array.map((item, index) => {
                let processed = processText(item);

                // For items after the first, check if they start with a capital letter
                if (index > 0) {
                    // Extract first word to check if it's an exception
                    const match = item.match(/^([A-Z][a-z]*)/);
                    if (match) {
                        const firstWord = match[1];
                        // Only lowercase if not an exception
                        if (!exceptions.includes(firstWord)) {
                            processed = processText(item.charAt(0).toLowerCase() + item.slice(1));
                        }
                    }
                }

                return processed;
            }).join(', ');
        }

        // Helper to convert to sentence case (only first letter capital)
        function toSentenceCase(text) {
             if (typeof text !== 'string' || !text) return text;
             
             const exceptions = [
                'God', 'Gods', 'Jezus', 'Christus', 'Heere', 'HEERE', 'Heer', 'Vader', 'Zoon', 'Geest', 'Heilige', 
                'Tweede', 'Kamer', 'Provinciale', 'Staten', 'Europees', 'Parlement', 
                'Bijbel', 'Satan', 'Eden', 'Adam', 'Eva', 'Israël', 'Jeruzalem', 'Babylon', 'Tyrus', 'Egypte', 'Rome', 
                'Griekse', 'Hebreeuwse', 'Daniël', 'Ezechiël', 'Ezekiel', 'Jesaja', 'Johannes', 'Lukas', 'Mattheüs', 'Markus',
                'Paulus', 'Petrus', 'Mozes', 'David', 'Salomo', 'Jakob', 'Abraham', 'Isaak',
                'Genesis', 'Exodus', 'Leviticus', 'Numeri', 'Deuteronomium', 'Jozua', 'Richteren', 'Ruth', 'Samuel', 'Koningen', 'Kronieken', 'Ezra', 'Nehemia', 'Esther', 'Job', 'Psalmen', 'Spreuken', 'Prediker', 'Hooglied', 'Jeremia', 'Klaagliederen', 'Hosea', 'Joël', 'Amos', 'Obadja', 'Jona', 'Micha', 'Nahum', 'Habakuk', 'Sefanja', 'Haggai', 'Zacharia', 'Maleachi', 'Handelingen', 'Romeinen', 'Korintiërs', 'Galaten', 'Efeziërs', 'Filippenzen', 'Kolossenzen', 'Thessalonicenzen', 'Timotheüs', 'Titus', 'Filemon', 'Hebreeën', 'Jakobus', 'Judas', 'Openbaring',
                'NICOT', 'NSBT', 'NIV', 'ESV', 'KJV', 'NBV', 'NBV21', 'Brazos', 'Eerdmans', 'Zondervan', 'Baker', 'Academic', 'InterVarsity', 'IVP', 'Oxford',
                'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'
             ];

             let lower = text.toLowerCase();
             
             // Capitalize first letter of string
             let result = lower.charAt(0).toUpperCase() + lower.slice(1);

             // Also capitalize the first letter after a number-dot-space pattern (e.g. "1. inleiding")
             result = result.replace(/^(\d+\.?\s+)([a-z])/g, function(match, prefix, letter) {
                 return prefix + letter.toUpperCase();
             });
             
             // Restore exceptions
             exceptions.forEach(exc => {
                 const regex = new RegExp(`\\b${exc}\\b`, 'gi');
                 result = result.replace(regex, exc);
             });

             return result;
        }

        // Process Naardense Bijbel text with special formatting
        function processNaardenseBijbel(text) {
            if (typeof text !== 'string') return text;

            // First convert literal \n to actual newlines (in case they exist)
            let result = text.replace(/\\n/g, '\n');

            // Fix pattern: –\nword\n– should become –word– (join words between dashes)
            result = result.replace(/–\n([^–]+?)\n–/g, '–$1–');

            // Fix: move punctuation from own line to previous line (but not hyphens followed by letters - those start parenthetical phrases)
            result = result.replace(/\n([;!.,?:])/g, '$1');
            result = result.replace(/\n(-(?![a-zA-Z]))/g, '$1');

            // Fix: join inline annotations like "Abel,-\nijlheid\n;" to "Abel,- ijlheid;" (but not exclamations like "Kaïn,-\nverworvene!")
            result = result.replace(/,-\n([a-z][^\n!]+?)\n([;,])/g, ',- $1$2');

            // Fix: keep short words (articles, prepositions) together with "Ene" on same line
            result = result.replace(/\b(de|het|een|van|voor|bij|tot|door|met|aan|op|in|uit|naar|over|onder|tegen|om|als|dan)\n(Ene)\b/g, '$1 $2');

            // Fix: keep "Ene" together with following lowercase word (except coordinating conjunctions like "en")
            result = result.replace(/\b(Ene)\n(?!en\b|of\b|maar\b)([a-z])/g, '$1 $2');

            // Fix: remove newline after * so footnote text follows directly
            result = result.replace(/\*\n/g, '* ');

            // Escape HTML special characters
            result = escapeHtml(result);

            // Style footnotes (text after * followed by space until end of sentence before next capitalized line)
            result = result.replace(/\* ([^]+?\.(?=\n[A-Z]))/g, '* <span style="color: var(--text-muted); font-size: 0.9em; font-style: italic;">$1</span>');

            // Convert "Ene" (God's name) to small caps
            result = result.replace(/\bEne\b/g, '<span style="font-variant: small-caps; letter-spacing: 0.05em;">Ene</span>');

            // Convert words between dashes to italic (like –rode–)
            result = result.replace(/–([^–<]+)–/g, '<em>–$1–</em>');

            // Convert newlines to <br> for poetic line structure
            result = result.replace(/\n/g, '<br>');

            return result;
        }

        // Process text: escape HTML, convert quotes, and handle newlines
        function processText(text) {
            if (typeof text !== 'string') return text;
            // First convert literal \n to actual newlines (before HTML escaping)
            let result = text.replace(/\\n/g, '\n');

            // Fix Naardense Bijbel: move punctuation from own line to previous line
            result = result.replace(/\n([;!.,?:-])/g, '$1');

            // Escape HTML special characters
            result = escapeHtml(result);

            // 2. Markdown Headers (handle before newlines, use more specific regex to avoid capturing mid-sentence #)
            // Process from most specific (####) to least specific (#) to avoid mismatches
            result = result.replace(/^[ \t]*####\s+(.*$)/gm, function(match, content) {
                return '<h4 style="color: var(--accent); margin: 20px 0 0 0; font-size: 1.05em; font-weight: 600;">' + toSentenceCase(content) + '</h4>';
            });
            result = result.replace(/^[ \t]*###\s+(.*$)/gm, function(match, content) {
                return '<h3 style="color: var(--accent); margin: 24px 0 6px 0; font-size: 1.1em; border-bottom: 1px dashed var(--border-light); padding-bottom: 2px;">' + toSentenceCase(content) + '</h3>';
            });
            result = result.replace(/^[ \t]*##\s+(.*$)/gm, function(match, content) {
                return '<h2 style="color: var(--accent); margin: 28px 0 10px 0; font-size: 1.25em;">' + toSentenceCase(content) + '</h2>';
            });
            result = result.replace(/^[ \t]*#\s+(.*$)/gm, function(match, content) {
                return '<h1 style="color: var(--accent); margin: 32px 0 12px 0; font-size: 1.5em;">' + toSentenceCase(content) + '</h1>';
            });

            // 3. List items (bullets and numbered) - BEFORE formatting to preserve markers
            // Handle bullet points with multiple spaces (e.g., "*   text")
            result = result.replace(/^(\s*)[-*](\s{2,})(.*$)/gm, function(match, indent, spaces, content) {
                return indent + '• ' + content;
            });
            // Handle regular bullet points
            result = result.replace(/^(\s*)[-*]\s+(.*$)/gm, function(match, indent, content) {
                return indent + '• ' + content;
            });
            // Handle numbered lists (e.g., 1. Item)
            result = result.replace(/^(\s*)(\d+\.)\s+(.*$)/gm, function(match, indent, num, content) {
                return indent + num + ' ' + content;
            });

            // 4. Bold and Italic formatting
            // First handle bold with nested italic: **text (*italic*) text**
            result = result.replace(/\*\*(.+?)\*\*/g, function(match, content) {
                // Inside bold, handle italic
                const processedContent = content.replace(/\*([^*]+)\*/g, '<em class="instruction">$1</em>');
                return '<strong>' + processedContent + '</strong>';
            });
            // Then handle remaining standalone italics
            result = result.replace(/(?<![*\w])\*([^*\n]+?)\*(?![*\w])/g, '<em class="instruction">$1</em>');

            // Strikethrough ~~text~~
            result = result.replace(/~~(.+?)~~/g, '<del style="text-decoration: line-through; color: var(--text-secondary); opacity: 0.6;">$1</del>');

            // 5. Convert bullet markers to styled divs
            result = result.replace(/^(\s*)• (.*)$/gm, function(match, indent, content) {
                const indentSize = indent.length * 10;
                return '<div class="list-item" style="margin: 0 0 0 ' + (15 + indentSize) + 'px; position: relative; padding-left: 15px;"><span style="position: absolute; left: 0; color: var(--accent);">•</span>' + content + '</div>';
            });

            // 5. Convert quotes to curly quotes
            result = smartQuotes(result);

            // 6. Clean up newlines around block elements
            // We only remove newlines AFTER headers/items to prevent double spacing below them.
            // We keep newlines BEFORE them so the natural Markdown spacing (witregels) is preserved.
            result = result.replace(/(<\/h[1-4]>|<\/div>)\n+/g, '$1');
            
            // Convert remaining newlines to <br> tags
            result = result.replace(/\n/g, '<br>');
            return result;
        }

        // Scroll handling
        let ticking = false;
        let isProgrammaticScroll = false;
        window.addEventListener('scroll', () => {
            if (!ticking) {
                window.requestAnimationFrame(() => {
                    handleScroll();
                    ticking = false;
                });
                ticking = true;
            }
        });

        function handleScroll() {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;

            // Show/hide scroll to top button
            scrollTopBtn.classList.toggle('visible', scrollTop > 300);

            // Update active nav item
            updateActiveNav();
        }

        function updateActiveNav() {
            const sections = document.querySelectorAll('.section');
            let currentSection = '';

            sections.forEach(section => {
                const rect = section.getBoundingClientRect();
                if (rect.top <= 150 && rect.bottom > 150) {
                    currentSection = section.id.replace('section-', '');
                }
            });

            let activeNavItem = null;

            document.querySelectorAll('.nav-item').forEach(item => {
                const isActive = item.dataset.section === currentSection;
                item.classList.toggle('active', isActive);

                if (isActive) {
                    activeNavItem = item;
                }

                // Vouw submenu's alleen in bij natuurlijk scrollen, niet bij klikken
                if (!isProgrammaticScroll) {
                    const hasSubmenu = item.dataset.hasSubmenu === 'true';
                    if (hasSubmenu && !isActive) {
                        item.classList.remove('expanded');
                        const submenu = item.nextElementSibling;
                        if (submenu && submenu.classList.contains('nav-submenu')) {
                            submenu.classList.remove('open');
                        }
                    }
                }
            });

            // Scroll het actieve item in beeld binnen de sidebar
            if (activeNavItem) {
                const sidebar = document.getElementById('sidebar');
                const navContainer = sidebar.querySelector('nav');

                if (navContainer) {
                    const itemRect = activeNavItem.getBoundingClientRect();
                    const navRect = navContainer.getBoundingClientRect();

                    // Check of het item buiten het zichtbare gebied van de sidebar is
                    if (itemRect.top < navRect.top || itemRect.bottom > navRect.bottom) {
                        // Scroll het item naar het midden van de sidebar
                        const scrollOffset = activeNavItem.offsetTop - navContainer.offsetTop - (navContainer.clientHeight / 2) + (activeNavItem.clientHeight / 2);
                        navContainer.scrollTo({
                            top: scrollOffset,
                            behavior: 'smooth'
                        });
                    }
                }
            }
        }

        // Scroll to top
        scrollTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Handle resize
        window.addEventListener('resize', () => {
            if (window.innerWidth > 900) {
                sidebar.classList.remove('visible');
                sidebar.classList.remove('hidden');
                mainContent.classList.remove('full-width');
                sidebarVisible = true;
            }
        });

        // --- NEW ---
        // Populate the file selector and load the default file
        function initialize() {
             jsonFiles.forEach(item => {
                 const option = document.createElement('option');
                 option.value = item.file;
                 option.textContent = item.label;
                 fileSelector.appendChild(option);
             });

             if (jsonFiles.length > 0) {
                 // Set the selector to the first file by default
                 const defaultFile = jsonFiles[defaultFileIndex].file;
                 fileSelector.value = defaultFile;
                 loadFile(defaultFile);
             }
        }
        
        // Run initialization when the DOM is loaded
        document.addEventListener('DOMContentLoaded', initialize);

        // Add event listener for the custom file load button
        document.getElementById('load-custom-btn').addEventListener('click', () => {
            document.getElementById('file-input').click();
        });

        // Store custom file data globally
        let customJsonData = null;

        // Add event listener for the file input
        document.getElementById('file-input').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                if (file.type === 'application/json' || file.name.endsWith('.json')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const parsedData = JSON.parse(e.target.result);

                            // Store custom data
                            customJsonData = parsedData;

                            // Remove any previous custom option
                            const existingCustom = fileSelector.querySelector('option[value^="custom:"]');
                            if (existingCustom) {
                                existingCustom.remove();
                            }

                            // Add custom file option at the top
                            const customOption = document.createElement('option');
                            customOption.value = 'custom:' + file.name;
                            customOption.textContent = '📄 ' + file.name + ' (aangepast)';
                            customOption.selected = true;
                            fileSelector.insertBefore(customOption, fileSelector.firstChild);

                            // Load the custom data
                            jsonData = customJsonData;
                            renderContent();
                        } catch (error) {
                            alert('Fout bij het lezen van het JSON-bestand: ' + error.message);
                        }
                    };
                    reader.readAsText(file);
                } else {
                    alert('Alleen JSON-bestanden zijn toegestaan.');
                }
            }

            // Reset file input for re-upload
            event.target.value = '';
        });

        // Render Ronde Tafel section as a chat conversation
        function renderRondeTafelSection(data, sectionKey) {
            let html = '';
            const sk = sectionKey || '66_ronde_tafel';

            // Kleurenpalet per spreker (maximaal 8 deelnemers)
            const speakerColors = [
                '#5b7fa6', '#7a9b6f', '#c67a7a', '#9b7a9e',
                '#c88f5f', '#6b8ba8', '#8b6f47', '#4a7c59'
            ];
            const speakerColorMap = {};

            // Deelnemers registreren + badges tonen
            if (Array.isArray(data.deelnemers)) {
                data.deelnemers.forEach((d, i) => {
                    speakerColorMap[d.naam] = speakerColors[i % speakerColors.length];
                });

                html += `<div id="section-${sk}-deelnemers" class="subsection-anchor"></div>`;
                html += `<div class="chat-participants">`;
                data.deelnemers.forEach(d => {
                    const color = speakerColorMap[d.naam] || '#888';
                    html += `<div class="chat-participant-badge" style="background:${color};">
                        ${escapeHtml(d.naam)}
                        <span class="badge-rol">— ${escapeHtml(d.rol)}</span>
                    </div>`;
                });
                html += `</div>`;
            }

            // Analyse meta
            if (data.analyse_meta) {
                const m = data.analyse_meta;
                html += `<div id="section-${sk}-analyse_meta" class="subsection-anchor"></div>`;
                html += `<div class="chat-meta-block">`;
                html += `<div class="data-group-title">Thema &amp; context</div>`;
                if (m.thema) html += `<div class="data-item"><div class="data-label">Thema</div><div class="data-value">${processText(m.thema)}</div></div>`;
                if (m.perikoop) html += `<div class="data-item"><div class="data-label">Perikoop</div><div class="data-value">${escapeHtml(m.perikoop)}</div></div>`;
                if (m.kernspanning) html += `<div class="data-item"><div class="data-label">Kernspanning</div><div class="data-value">${processText(m.kernspanning)}</div></div>`;
                html += `</div>`;
            }

            // Dialoog als chatberichten
            if (Array.isArray(data.dialoog)) {
                html += `<div id="section-${sk}-dialoog" class="subsection-anchor"></div>`;
                html += `<div class="chat-container">`;

                // Bepaal welke spreker "rechts" staat (de tweede unieke spreker, zodat het afwisselt)
                const uniqueSpeakers = [...new Set(data.dialoog.map(m => m.spreker))];
                const rightSpeaker = uniqueSpeakers[2] || null; // 3e spreker rechts voor variatie

                data.dialoog.forEach(msg => {
                    const color = speakerColorMap[msg.spreker] || '#888';
                    const initial = msg.spreker ? msg.spreker.charAt(0).toUpperCase() : '?';
                    const isRight = msg.spreker === rightSpeaker;

                    // Vind de rol van de spreker
                    const deelnemer = (data.deelnemers || []).find(d => d.naam === msg.spreker);
                    const rolLabel = deelnemer ? deelnemer.rol : '';

                    let msgClass = 'chat-message';
                    if (rolLabel === 'Moderator') msgClass += ' moderator';
                    else if (isRight) msgClass += ' right';

                    html += `<div class="${msgClass}">`;
                    if (rolLabel !== 'Moderator') {
                        html += `<div class="chat-avatar" style="background:${color};">${escapeHtml(initial)}</div>`;
                    }
                    html += `<div class="chat-bubble">`;
                    html += `<div class="chat-speaker" style="color:${color};">
                        ${escapeHtml(msg.spreker)}
                        ${rolLabel ? `<span class="badge-rol" style="font-weight:normal;font-size:0.85em;color:var(--text-muted);">— ${escapeHtml(rolLabel)}</span>` : ''}
                        ${msg.fase ? `<span class="chat-fase-badge">${escapeHtml(msg.fase)}</span>` : ''}
                    </div>`;
                    html += `<div class="chat-text">${processText(msg.tekst)}</div>`;
                    html += `</div></div>`;
                });

                html += `</div>`;
            }

            // Minority report
            if (data.minority_report) {
                const mr = data.minority_report;
                html += `<div id="section-${sk}-minority_report" class="subsection-anchor"></div>`;
                html += `<div class="chat-minority-report">`;
                html += `<div class="data-group-title" style="font-size:1.1em; margin-bottom:14px;">Minority Report</div>`;

                if (Array.isArray(mr.onopgeloste_spanningen)) {
                    html += `<div class="chat-minority-block">
                        <h4>Onopgeloste spanningen</h4><ul>`;
                    mr.onopgeloste_spanningen.forEach(s => {
                        html += `<li>${processText(s)}</li>`;
                    });
                    html += `</ul></div>`;
                }

                if (Array.isArray(mr.kritische_blinde_vlekken)) {
                    html += `<div class="chat-minority-block">
                        <h4>Kritische blinde vlekken</h4><ul>`;
                    mr.kritische_blinde_vlekken.forEach(v => {
                        html += `<li>${processText(v)}</li>`;
                    });
                    html += `</ul></div>`;
                }

                if (Array.isArray(mr.innovatieve_raakvlakken)) {
                    html += `<div class="chat-minority-block">
                        <h4>Innovatieve raakvlakken</h4><ul>`;
                    mr.innovatieve_raakvlakken.forEach(r => {
                        html += `<li>${processText(r)}</li>`;
                    });
                    html += `</ul></div>`;
                }

                html += `</div>`;
            }

            // Homiletische oogst
            if (data.homiletische_oogst) {
                const oogst = data.homiletische_oogst;
                html += `<div id="section-${sk}-homiletische_oogst" class="subsection-anchor"></div>`;
                html += `<div class="chat-minority-report" style="border-left-color: var(--accent-light);">`;
                html += `<div class="data-group-title" style="font-size:1.1em; margin-bottom:14px;">Homiletische oogst</div>`;

                if (oogst.tentatieve_proclamatie) {
                    html += `<div class="chat-minority-block">
                        <h4>Tentatieve proclamatie</h4>
                        <div style="font-style:italic; line-height:1.7;">${processText(oogst.tentatieve_proclamatie)}</div>
                    </div>`;
                }
                if (oogst.pastorale_winst) {
                    html += `<div class="chat-minority-block">
                        <h4>Pastorale winst</h4>
                        <div style="line-height:1.7;">${processText(oogst.pastorale_winst)}</div>
                    </div>`;
                }
                if (oogst.advies_voor_de_prediker) {
                    html += `<div class="chat-minority-block">
                        <h4>Advies voor de prediker</h4>
                        <div style="line-height:1.7;">${processText(oogst.advies_voor_de_prediker)}</div>
                    </div>`;
                }

                html += `</div>`;
            }

            return html;
        }

        // Dynamic Layout Adjustment for Variable Header Height
        function adjustLayout() {
            const header = document.querySelector('header');
            const sidebar = document.querySelector('.sidebar');
            const main = document.querySelector('main');
            
            if (header) {
                const height = header.offsetHeight;
                
                if (sidebar) {
                    sidebar.style.top = height + 'px';
                    sidebar.style.height = `calc(100vh - ${height}px)`;
                }
                
                if (main) {
                    main.style.marginTop = height + 'px';
                    main.style.minHeight = `calc(100vh - ${height}px)`;
                }
                
                // Adjust section info panel (sticky positioning)
                // Note: sticky elements are inside main, so top is relative to viewport usually if ancestors don't constrain it.
                // But if we want it to stick below header:
                const sectionInfoPanel = document.querySelector('.section-info-panel');
                if (sectionInfoPanel) {
                    sectionInfoPanel.style.top = (height + 20) + 'px';
                    sectionInfoPanel.style.maxHeight = `calc(100vh - ${height + 40}px)`;
                }
            }
        }
        
        // Initial adjustment
        window.addEventListener('load', adjustLayout);
        window.addEventListener('resize', adjustLayout);
        
        // Run after short delay to ensure rendering
        setTimeout(adjustLayout, 100);
        
        // Also run when content is rendered (hook into renderContent if possible, or just observe)
        const resizeObserver = new ResizeObserver(() => {
            adjustLayout();
        });
        if (header) resizeObserver.observe(header);
        
        // Hook into file loading to re-check layout (in case scrollbars appear/disappear etc)
        const originalRenderContent = renderContent;
        renderContent = function() {
            const result = originalRenderContent.apply(this, arguments);
            // Wait for DOM update
            setTimeout(adjustLayout, 50);
            return result;
        }

    </script>
